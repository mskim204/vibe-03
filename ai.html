<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험 범위 퀴즈 출제기</title>
<script>
// ===== 여기만 고치면 돼요 =====
const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec";
const CLASS_CODE = "vibe7128";
const MAX_INPUT = 1000;   // 시험 범위 입력 글자 수 제한

// AI 성격(system)을 세 부분으로 나눠 적어요. 아래 글만 바꿔도 AI가 달라져요.
// ① 역할: AI가 누구인지
const ROLE = "너는 중학생을 위한 시험 문제 출제 선생님이야.";

// ② 규칙: 문제를 어떻게 만들지
const RULES = [
  "학생이 준 시험 범위 내용 안에서만 문제를 내.",
  "객관식, OX, 단답형을 골고루 섞어.",
  "객관식은 보기 4개, OX는 보기 [\"O\", \"X\"]로 해.",
  "해설은 중학생이 알아듣기 쉽게 한두 문장으로 짧게 써.",
  "마크다운(별표, # 등)은 쓰지 마."
];

// ③ 답 모양: 반드시 이 JSON 모양으로만 답하게 해요 (화면이 이 모양을 읽어요)
const FORMAT = `다른 말 없이 아래 JSON 하나만 출력해.
{
  "title": "퀴즈 제목",
  "questions": [
    {
      "type": "객관식 또는 OX 또는 단답형",
      "question": "문제",
      "choices": ["보기1", "보기2", "보기3", "보기4"],
      "answer": "정답 (객관식·OX는 보기 중 하나와 똑같이)",
      "explanation": "해설"
    }
  ]
}
단답형은 "choices": [] 로 둬.`;
// ===============================

// 세 부분을 합쳐서 AI에게 보낼 system을 만들어요.
const SYSTEM = "[역할]\n" + ROLE +
  "\n\n[규칙]\n" + RULES.map((r, i) => (i + 1) + ". " + r).join("\n") +
  "\n\n[답 모양]\n" + FORMAT;
</script>
<style>
  :root { --main: #4338ca; --soft: #eef2ff; --line: #dfe3f0; --ok: #15803d; --bad: #b91c1c; }
  * { box-sizing: border-box; }
  body { font-family: "맑은 고딕", sans-serif; max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; background: #f5f7fb; color: #222; }
  h1 { color: var(--main); margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 20px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { font-weight: bold; display: block; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; padding: 12px; font: inherit; font-size: 1rem; border: 1px solid #ccc; border-radius: 10px; resize: vertical; }
  .counter { text-align: right; font-size: .85rem; color: #666; margin-top: 4px; }
  .counter.full { color: var(--bad); font-weight: bold; }
  .options { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; }
  .primary { flex: 1; min-width: 160px; padding: 12px; font-size: 1.05rem; font-weight: bold; color: #fff; background: var(--main); }
  .primary:disabled { background: #a5b4fc; cursor: default; }
  .ghost { padding: 8px 14px; color: var(--main); background: #fff; border: 2px solid #c7d2fe; }
  #status { min-height: 1.5em; margin: 16px 0 8px; color: #555; }
  .error-box { background: #fdecea; color: var(--bad); border: 1px solid #f3b8b2; border-radius: 12px; padding: 14px 16px; }
  .error-box button { margin-top: 10px; padding: 10px 16px; color: #fff; background: var(--bad); font-weight: bold; }
  .error-box details { margin-top: 8px; color: #555; font-size: .85rem; }
  .error-box pre { white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; }
  .quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 12px; }
  .quiz-head h2 { margin: 0; font-size: 1.3rem; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .num { font-weight: bold; color: var(--main); }
  .tag { font-size: .8rem; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--main); }
  .q { font-size: 1.05rem; line-height: 1.6; margin: 0 0 10px; white-space: pre-wrap; }
  .choices { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 6px; }
  .choices button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; font-size: 1rem; color: #222; background: #fff; border: 2px solid var(--line); }
  .choices button:not(:disabled):hover { border-color: #a5b4fc; background: #f8f9ff; }
  .choices button:disabled { cursor: default; }
  .choices .no { flex: none; min-width: 2.6em; padding: 2px 6px; border-radius: 6px; background: var(--soft); color: var(--main); font-weight: bold; text-align: center; font-size: .9rem; }
  .choices button.correct { border-color: var(--ok); background: #f0fdf4; color: var(--ok); font-weight: bold; }
  .choices button.wrong { border-color: var(--bad); background: #fef2f2; color: var(--bad); }
  .choices button.picked::after { content: "← 내가 고른 답"; margin-left: auto; font-size: .8rem; font-weight: normal; }
  .feedback { font-weight: bold; margin-bottom: 4px; }
  .feedback.good { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .score { font-weight: bold; color: var(--main); }
  .head-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .answer { display: none; background: var(--soft); border-radius: 8px; padding: 10px 12px; line-height: 1.6; }
  .card.open .answer { display: block; }
  .answer b { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; margin-top: 8px; }
  th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { background: var(--main); color: #fff; font-weight: normal; }
  th:first-child, td:first-child { width: 56px; white-space: nowrap; text-align: center; }
  td:first-child { font-weight: bold; color: var(--main); }
  .table-wrap { overflow-x: auto; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>📝 시험 범위 퀴즈 출제기</h1>
<p class="sub">시험 범위 내용을 붙여 넣으면 AI가 퀴즈를 만들어 줘요.</p>

<div class="panel">
  <label for="range">시험 범위 내용</label>
  <textarea id="range" placeholder="예) 광합성은 식물이 빛 에너지를 이용해 이산화 탄소와 물로 포도당을 만드는 과정이다. ..."></textarea>
  <div class="counter" id="counter"></div>
  <div class="options">
    <label for="count" style="margin:0">문제 수</label>
    <select id="count">
      <option>3</option>
      <option selected>5</option>
      <option>7</option>
      <option>10</option>
    </select>
    <button id="make" class="primary">퀴즈 만들기</button>
  </div>
</div>

<p id="status" aria-live="polite"></p>
<div id="error" class="hidden"></div>

<div id="result" class="hidden">
  <div class="quiz-head">
    <div>
      <h2 id="quizTitle"></h2>
      <div id="score" class="score"></div>
    </div>
    <div class="head-btns">
      <button id="restart" class="ghost" type="button">처음부터 다시 풀기</button>
      <button id="toggleAll" class="ghost" type="button">정답 모두 보기</button>
    </div>
  </div>
  <div id="cards"></div>
  <h3>📋 정답표</h3>
  <div class="table-wrap">
    <table>
      <thead><tr><th>번호</th><th>유형</th><th>정답</th></tr></thead>
      <tbody id="answerTable"></tbody>
    </table>
  </div>
</div>

<script>
const rangeEl = document.getElementById("range");
const counterEl = document.getElementById("counter");
const countEl = document.getElementById("count");
const makeBtn = document.getElementById("make");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const resultEl = document.getElementById("result");
const cardsEl = document.getElementById("cards");
const tableEl = document.getElementById("answerTable");
const toggleAllBtn = document.getElementById("toggleAll");

// ---- 1000자 제한 ----
rangeEl.maxLength = MAX_INPUT;
function updateCounter() {
  if (rangeEl.value.length > MAX_INPUT) rangeEl.value = rangeEl.value.slice(0, MAX_INPUT);
  const n = rangeEl.value.length;
  counterEl.textContent = n + " / " + MAX_INPUT + "자" + (n >= MAX_INPUT ? " (더 쓸 수 없어요)" : "");
  counterEl.classList.toggle("full", n >= MAX_INPUT);
}
rangeEl.addEventListener("input", updateCounter);
updateCounter();

// 화면에 글 붙이는 도우미 (textContent라서 안전해요)
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ---- AI 답에서 JSON 꺼내고 모양 검사하기 ----
function parseQuiz(text) {
  let s = String(text).replace(/```(?:json)?/gi, "").trim();
  const start = s.indexOf("{"), end = s.lastIndexOf("}");
  if (start < 0 || end <= start) throw new Error("JSON을 찾을 수 없어요.");
  const data = JSON.parse(s.slice(start, end + 1));

  if (!Array.isArray(data.questions) || data.questions.length === 0)
    throw new Error("questions 목록이 없어요.");
  data.questions.forEach((q, i) => {
    const no = (i + 1) + "번 문제: ";
    if (!q || typeof q.question !== "string" || !q.question.trim()) throw new Error(no + "question이 없어요.");
    if (q.answer === undefined || q.answer === null || String(q.answer).trim() === "") throw new Error(no + "answer가 없어요.");
    if (q.choices !== undefined && !Array.isArray(q.choices)) throw new Error(no + "choices가 목록이 아니에요.");
    q.choices = (q.choices || []).map(String);
    q.answer = String(q.answer);
    q.type = q.type ? String(q.type) : (q.choices.length ? "객관식" : "단답형");
    q.explanation = q.explanation ? String(q.explanation) : "";
  });
  data.title = data.title ? String(data.title) : "시험 범위 퀴즈";
  return data;
}

// ---- 보기 중 몇 번이 정답인지 찾기 ----
// AI가 정답을 "빛"처럼 보기 글로 줄 수도, "1"·"1번"·"①"처럼 번호로 줄 수도 있어요.
function findCorrect(q) {
  const a = q.answer.trim();
  let idx = q.choices.findIndex(c => c.trim() === a);
  if (idx >= 0) return idx;
  const circled = "①②③④⑤⑥".indexOf(a.charAt(0));
  if (circled >= 0 && circled < q.choices.length) return circled;
  const m = a.match(/^(\d+)\s*번?$/);
  if (m && +m[1] >= 1 && +m[1] <= q.choices.length) return +m[1] - 1;
  return q.choices.findIndex(c => c.trim() && (a.includes(c.trim()) || c.includes(a)));
}

let currentQuiz = null;

// ---- 카드와 정답표 그리기 ----
function render(quiz) {
  currentQuiz = quiz;
  document.getElementById("quizTitle").textContent = quiz.title;
  cardsEl.innerHTML = "";
  tableEl.innerHTML = "";

  quiz.questions.forEach((q, i) => {
    const card = el("div", "card");
    const top = el("div", "card-top");
    top.append(el("span", "num", "Q" + (i + 1)), el("span", "tag", q.type));
    card.append(top, el("p", "q", q.question));

    const correctIdx = q.choices.length ? findCorrect(q) : -1;
    if (q.choices.length) {
      card.dataset.choice = "1";   // 골라서 푸는 문제 (점수에 들어가요)
      const list = el("ol", "choices");
      q.choices.forEach((c, j) => {
        const b = el("button");
        b.type = "button";
        // OX는 O/X 그대로, 나머지는 1번·2번·3번·4번
        if (q.choices.length > 2) b.append(el("span", "no", (j + 1) + "번"));
        b.append(el("span", "", c));
        if (j === correctIdx) b.dataset.correct = "1";
        b.addEventListener("click", () => choose(card, b, j === correctIdx));
        const li = el("li");
        li.append(b);
        list.append(li);
      });
      card.append(list);
    }

    const ans = el("div", "answer");
    ans.append(el("div", "feedback"));
    const answerText = correctIdx >= 0 && q.choices.length > 2
      ? (correctIdx + 1) + "번 " + q.choices[correctIdx]
      : q.answer;
    ans.append(el("b", "", "정답: " + answerText));
    if (q.explanation) ans.append(el("div", "", "해설: " + q.explanation));
    card.append(ans);

    const btn = el("button", "ghost toggle", "정답 보기");
    btn.type = "button";
    btn.style.marginTop = "8px";
    btn.addEventListener("click", () => setOpen(card, !card.classList.contains("open")));
    card.append(btn);
    cardsEl.append(card);

    const tr = el("tr");
    tr.append(el("td", "", i + 1), el("td", "", q.type), el("td", "", answerText));
    tableEl.append(tr);
  });

  toggleAllBtn.textContent = "정답 모두 보기";
  updateScore();
  resultEl.classList.remove("hidden");
}

// 보기를 골랐을 때: 맞았는지 보여 주고, 그 문제는 더 못 바꿔요.
function choose(card, btn, isCorrect) {
  if (card.dataset.done) return;
  card.dataset.done = isCorrect ? "right" : "wrong";
  btn.classList.add("picked");
  if (!isCorrect) btn.classList.add("wrong");
  const fb = card.querySelector(".feedback");
  fb.textContent = isCorrect ? "⭕ 정답이에요!" : "❌ 아쉬워요. 정답을 확인해 보세요.";
  fb.className = "feedback " + (isCorrect ? "good" : "bad");
  setOpen(card, true);
  updateScore();
}

function setOpen(card, open) {
  card.classList.toggle("open", open);
  card.querySelector(".toggle").textContent = open ? "정답 숨기기" : "정답 보기";
  card.querySelectorAll("[data-correct]").forEach(b => b.classList.toggle("correct", open));
  // 정답을 본 뒤에는 고를 수 없어요. (아직 안 푼 문제는 정답을 숨기면 다시 고를 수 있어요)
  card.querySelectorAll(".choices button").forEach(b => b.disabled = open || !!card.dataset.done);
}

function updateScore() {
  const cards = [...cardsEl.querySelectorAll('.card[data-choice]')];
  const solved = cards.filter(c => c.dataset.done).length;
  const right = cards.filter(c => c.dataset.done === "right").length;
  document.getElementById("score").textContent = cards.length
    ? "점수: " + right + " / " + cards.length + " (푼 문제 " + solved + "개)"
    : "";
}

document.getElementById("restart").addEventListener("click", () => {
  if (currentQuiz) render(currentQuiz);
});

toggleAllBtn.addEventListener("click", () => {
  const cards = [...cardsEl.children];
  const openAll = cards.some(c => !c.classList.contains("open"));
  cards.forEach(c => setOpen(c, openAll));
  toggleAllBtn.textContent = openAll ? "정답 모두 숨기기" : "정답 모두 보기";
});

// ---- 오류 + 다시 시도 버튼 ----
function showError(message, raw) {
  errorEl.innerHTML = "";
  errorEl.className = "error-box";
  errorEl.append(el("div", "", "⚠️ " + message));
  const retry = el("button", "", "🔄 다시 시도");
  retry.type = "button";
  retry.addEventListener("click", makeQuiz);
  errorEl.append(retry);
  if (raw) {
    const d = el("details");
    d.append(el("summary", "", "AI가 보낸 원래 답 보기"), el("pre", "", raw));
    errorEl.append(d);
  }
}

// ---- 퀴즈 만들기 ----
async function makeQuiz() {
  const range = rangeEl.value.trim().slice(0, MAX_INPUT);
  if (!range) { statusEl.textContent = "시험 범위 내용을 먼저 적어 주세요."; rangeEl.focus(); return; }

  makeBtn.disabled = true;
  errorEl.className = "hidden";
  resultEl.classList.add("hidden");
  statusEl.textContent = "문제를 만드는 중… (10초쯤 걸릴 수 있어요)";

  const question = "아래 시험 범위로 문제 " + countEl.value + "개를 만들어 줘.\n\n[시험 범위]\n" + range;
  let raw = "";
  try {
    const res = await fetch(SERVER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ code: CLASS_CODE, system: SYSTEM, messages: [{ role: "user", content: question }] })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw { msg: "서버 응답을 읽을 수 없어요. (HTTP " + res.status + ")" }; }
    if (!data.ok) throw { msg: "오류: " + (data.error || "알 수 없는 이유") };

    raw = data.text;
    let quiz;
    try { quiz = parseQuiz(raw); }
    catch (e) { throw { msg: "AI 답의 모양이 깨져서 왔어요. " + e.message, raw }; }

    render(quiz);
    statusEl.textContent = "퀴즈 " + quiz.questions.length + "문제가 만들어졌어요!";
  } catch (e) {
    statusEl.textContent = "";
    showError(e.msg || ("서버에 연결하지 못했어요. (" + (e.message || e) + ")"), e.raw);
  } finally {
    makeBtn.disabled = false;
  }
}

makeBtn.addEventListener("click", makeQuiz);
</script>
</body>
</html>
