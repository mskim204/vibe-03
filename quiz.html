<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4지선다 퀴즈</title>
<script>
// ===== 여기만 고치면 돼요 =====
const SERVER_URL = "https://script.google.com/macros/s/AKfycbw5e2VaJzlwoMKoy-X5Tk4jKBKYJllw1LC99mnAsaYtsbB1A3YOgc-uUL1yd4CCuAUmvg/exec";
const CLASS_CODE = "vibe7128";
const QUESTION_COUNT = 5;   // 문제 수
const MAX_TOPIC = 200;      // 주제 입력 글자 수 제한

// AI 성격(system): 역할 · 규칙 · 답 모양
const ROLE = "너는 중학생을 위한 퀴즈 출제 선생님이야.";
const RULES = [
  "학생이 준 주제로 4지선다 문제를 " + QUESTION_COUNT + "개 만들어.",
  "보기는 꼭 4개이고, 정답은 그중 하나뿐이어야 해.",
  "정답 번호가 한쪽으로 몰리지 않게 섞어.",
  "중학생이 이해할 수 있는 쉬운 말로 써. 마크다운(별표, # 등)은 쓰지 마."
];
const FORMAT = `다른 말 없이 아래 모양의 JSON 배열 하나만 출력해. 정답은 1~4 중 보기 번호(숫자)야.
[{"문제":"","보기":["","","",""],"정답":1}]`;
// ===============================

const SYSTEM = "[역할]\n" + ROLE +
  "\n\n[규칙]\n" + RULES.map((r, i) => (i + 1) + ". " + r).join("\n") +
  "\n\n[답 모양]\n" + FORMAT;
</script>
<style>
  :root { --main: #4338ca; --soft: #eef2ff; --line: #dfe3f0; --ok: #15803d; --bad: #b91c1c; }
  * { box-sizing: border-box; }
  body { font-family: "맑은 고딕", sans-serif; max-width: 640px; margin: 0 auto; padding: 32px 16px 60px; background: #f5f7fb; color: #222; }
  h1 { color: var(--main); margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 20px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; font: inherit; font-size: 1rem; border: 1px solid #ccc; border-radius: 10px; }
  .counter { text-align: right; font-size: .85rem; color: #666; margin-top: 4px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; }
  .primary { padding: 12px 18px; font-size: 1.05rem; font-weight: bold; color: #fff; background: var(--main); }
  .primary:disabled { background: #a5b4fc; cursor: default; }
  .ghost { padding: 10px 16px; color: var(--main); background: #fff; border: 2px solid #c7d2fe; font-weight: bold; }
  #status { min-height: 1.5em; margin: 16px 0 8px; color: #555; }
  .error-box { background: #fdecea; color: var(--bad); border: 1px solid #f3b8b2; border-radius: 12px; padding: 14px 16px; }
  .error-box button { margin-top: 10px; padding: 10px 16px; color: #fff; background: var(--bad); font-weight: bold; }
  .error-box details { margin-top: 8px; color: #555; font-size: .85rem; }
  .error-box pre { white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; }
  .bar .score { color: var(--main); }
  .progress { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .progress div { height: 100%; background: var(--main); transition: width .3s; }
  .q { font-size: 1.15rem; line-height: 1.6; margin: 0 0 14px; white-space: pre-wrap; }
  .choices { display: grid; gap: 8px; }
  .choice { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; font-size: 1rem; color: #222; background: #fff; border: 2px solid var(--line); }
  .choice:not(:disabled):hover { border-color: #a5b4fc; background: #f8f9ff; }
  .choice:disabled { cursor: default; }
  .choice .no { flex: none; min-width: 2.8em; padding: 2px 6px; border-radius: 6px; background: var(--soft); color: var(--main); font-weight: bold; text-align: center; font-size: .9rem; }
  .choice.correct { border-color: var(--ok); background: #f0fdf4; color: var(--ok); font-weight: bold; }
  .choice.wrong { border-color: var(--bad); background: #fef2f2; color: var(--bad); }
  .feedback { margin: 14px 0 0; font-weight: bold; font-size: 1.1rem; }
  .feedback.good { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  #next { margin-top: 14px; width: 100%; }
  .big { font-size: 2.4rem; font-weight: bold; color: var(--main); text-align: center; margin: 8px 0; }
  .center { text-align: center; color: #555; margin: 0 0 14px; }
  .table-wrap { overflow-x: auto; margin: 10px 0 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { background: var(--main); color: #fff; font-weight: normal; white-space: nowrap; }
  td.mark { text-align: center; font-size: 1.1rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { flex: 1; min-width: 140px; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>🧠 4지선다 퀴즈</h1>
<p class="sub">주제를 적으면 AI가 4지선다 문제 5개를 만들어 줘요.</p>

<div class="panel">
  <div class="row">
    <input type="text" id="topic" placeholder="예) 광합성, 임진왜란, 일차방정식">
    <button id="make" class="primary">문제 만들기</button>
  </div>
  <div class="counter" id="counter"></div>
</div>

<p id="status" aria-live="polite"></p>
<div id="error" class="hidden"></div>

<!-- 한 문제씩 푸는 화면 -->
<div id="play" class="panel hidden">
  <div class="bar"><span id="qNum"></span><span class="score" id="score"></span></div>
  <div class="progress"><div id="progress"></div></div>
  <p class="q" id="qText"></p>
  <div class="choices" id="choices"></div>
  <p class="feedback" id="feedback" aria-live="polite"></p>
  <button id="next" class="primary hidden">다음 문제</button>
</div>

<!-- 끝난 화면 -->
<div id="done" class="panel hidden">
  <p class="center">퀴즈 끝! 내 점수는</p>
  <div class="big" id="finalScore"></div>
  <p class="center" id="finalMsg"></p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>번호</th><th>문제</th><th>정답</th><th>내 답</th><th>결과</th></tr></thead>
      <tbody id="review"></tbody>
    </table>
  </div>
  <div class="actions">
    <button id="csv" class="primary">💾 CSV 저장</button>
    <button id="again" class="ghost">같은 문제 다시 풀기</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const topicEl = $("topic"), makeBtn = $("make"), statusEl = $("status"), errorEl = $("error");

let quiz = [];      // [{문제, 보기[4], 정답(1~4)}]
let picks = [];     // 내가 고른 번호(1~4)
let current = 0;
let score = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ---- 주제 글자 수 제한 ----
topicEl.maxLength = MAX_TOPIC;
function updateCounter() {
  if (topicEl.value.length > MAX_TOPIC) topicEl.value = topicEl.value.slice(0, MAX_TOPIC);
  $("counter").textContent = topicEl.value.length + " / " + MAX_TOPIC + "자";
}
topicEl.addEventListener("input", updateCounter);
updateCounter();

// ---- AI 답에서 JSON 배열 꺼내고 모양 검사하기 ----
function parseQuiz(text) {
  const s = String(text).replace(/```(?:json)?/gi, "").trim();
  const start = s.indexOf("["), end = s.lastIndexOf("]");
  if (start < 0 || end <= start) throw new Error("JSON 배열을 찾을 수 없어요.");
  const arr = JSON.parse(s.slice(start, end + 1));
  if (!Array.isArray(arr) || arr.length === 0) throw new Error("문제가 하나도 없어요.");

  return arr.map((q, i) => {
    const no = (i + 1) + "번 문제: ";
    if (!q || typeof q.문제 !== "string" || !q.문제.trim()) throw new Error(no + "'문제'가 없어요.");
    if (!Array.isArray(q.보기) || q.보기.length !== 4) throw new Error(no + "'보기'가 4개가 아니에요.");
    const answer = Number(String(q.정답).replace(/[^0-9]/g, ""));
    if (!(answer >= 1 && answer <= 4)) throw new Error(no + "'정답'이 1~4 번호가 아니에요.");
    return { 문제: q.문제.trim(), 보기: q.보기.map(c => String(c)), 정답: answer };
  });
}

// ---- 오류 + 다시 시도 ----
function showError(message, raw) {
  errorEl.innerHTML = "";
  errorEl.className = "error-box";
  errorEl.append(el("div", "", "⚠️ " + message));
  const retry = el("button", "", "🔄 다시 시도");
  retry.type = "button";
  retry.addEventListener("click", makeQuiz);
  errorEl.append(retry);
  if (raw) {
    const d = el("details");
    d.append(el("summary", "", "AI가 보낸 원래 답 보기"), el("pre", "", raw));
    errorEl.append(d);
  }
}

// ---- 문제 만들기 (ai.html과 같은 방법으로 선생님 중계 서버에 보내요) ----
async function makeQuiz() {
  const topic = topicEl.value.trim().slice(0, MAX_TOPIC);
  if (!topic) { statusEl.textContent = "주제를 먼저 적어 주세요."; topicEl.focus(); return; }

  makeBtn.disabled = true;
  errorEl.className = "hidden";
  $("play").classList.add("hidden");
  $("done").classList.add("hidden");
  statusEl.textContent = "문제를 만드는 중… (10초쯤 걸릴 수 있어요)";

  try {
    const res = await fetch(SERVER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        code: CLASS_CODE,
        system: SYSTEM,
        messages: [{ role: "user", content: "주제: " + topic }]
      })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw { msg: "서버 응답을 읽을 수 없어요. (HTTP " + res.status + ")" }; }
    if (!data.ok) throw { msg: "오류: " + (data.error || "알 수 없는 이유") };

    try { quiz = parseQuiz(data.text).slice(0, QUESTION_COUNT); }
    catch (e) { throw { msg: "AI 답의 모양이 깨져서 왔어요. " + e.message, raw: data.text }; }

    statusEl.textContent = "";
    start();
  } catch (e) {
    statusEl.textContent = "";
    showError(e.msg || ("서버에 연결하지 못했어요. (" + (e.message || e) + ")"), e.raw);
  } finally {
    makeBtn.disabled = false;
  }
}

// ---- 한 문제씩 풀기 ----
function start() {
  current = 0; score = 0; picks = [];
  $("done").classList.add("hidden");
  $("play").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  const q = quiz[current];
  $("qNum").textContent = "문제 " + (current + 1) + " / " + quiz.length;
  $("score").textContent = "점수 " + score + "점";
  $("progress").style.width = (current / quiz.length * 100) + "%";
  $("qText").textContent = q.문제;
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("next").classList.add("hidden");

  const box = $("choices");
  box.innerHTML = "";
  q.보기.forEach((c, i) => {
    const b = el("button", "choice");
    b.type = "button";
    b.append(el("span", "no", (i + 1) + "번"), el("span", "", c));
    b.addEventListener("click", () => choose(i + 1));
    box.append(b);
  });
}

function choose(n) {
  const q = quiz[current];
  const buttons = [...$("choices").children];
  buttons.forEach(b => b.disabled = true);
  buttons[q.정답 - 1].classList.add("correct");
  picks[current] = n;

  const fb = $("feedback");
  if (n === q.정답) {
    score++;
    fb.textContent = "⭕ 맞았어요!";
    fb.className = "feedback good";
  } else {
    buttons[n - 1].classList.add("wrong");
    fb.textContent = "❌ 틀렸어요. (정답: " + q.정답 + "번 " + q.보기[q.정답 - 1] + ")";
    fb.className = "feedback bad";
  }
  $("score").textContent = "점수 " + score + "점";
  $("progress").style.width = ((current + 1) / quiz.length * 100) + "%";

  const next = $("next");
  next.textContent = current + 1 < quiz.length ? "다음 문제 →" : "결과 보기";
  next.classList.remove("hidden");
  next.focus();
}

$("next").addEventListener("click", () => {
  current++;
  if (current < quiz.length) showQuestion();
  else showDone();
});

// ---- 끝난 화면 ----
function showDone() {
  $("play").classList.add("hidden");
  $("done").classList.remove("hidden");
  $("finalScore").textContent = score + " / " + quiz.length;
  const rate = score / quiz.length;
  $("finalMsg").textContent = rate === 1 ? "🎉 모두 맞혔어요!" : rate >= 0.6 ? "👍 잘했어요!" : "💪 틀린 문제를 다시 보고 도전해 봐요!";

  const tbody = $("review");
  tbody.innerHTML = "";
  quiz.forEach((q, i) => {
    const tr = el("tr");
    const ok = picks[i] === q.정답;
    tr.append(
      el("td", "", i + 1),
      el("td", "", q.문제),
      el("td", "", q.정답 + "번 " + q.보기[q.정답 - 1]),
      el("td", "", picks[i] + "번"),
      el("td", "mark", ok ? "⭕" : "❌")
    );
    tbody.append(tr);
  });
}

$("again").addEventListener("click", start);

// ---- CSV 저장 (엑셀에서 한글이 안 깨지게 맨 앞에 BOM을 붙여요) ----
function csvCell(v) {
  const s = String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

$("csv").addEventListener("click", () => {
  const rows = [["문제", "보기1", "보기2", "보기3", "보기4", "정답"]];
  quiz.forEach(q => rows.push([q.문제, ...q.보기, q.정답]));
  const csv = "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = el("a");
  a.href = url;
  a.download = "문제.csv";
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

makeBtn.addEventListener("click", makeQuiz);
topicEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); makeQuiz(); }
});
</script>
</body>
</html>
