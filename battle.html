<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공격 방어 회복 대결</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
// ===== 여기만 고치면 돼요 =====
// 처음 능력치 (모두 똑같이 시작해요)
const BASE = { hp: 100, atk: 15, def: 10, heal: 10 };
// 스탯 포인트 1개를 찍으면 오르는 양
const STAT_UP = { hp: 15, atk: 4, def: 4, heal: 4 };
const START_POINTS = 5;   // 캐릭터 꾸밀 때 받는 스탯 포인트
const ROUND_POINTS = 1;   // 라운드가 끝날 때마다 받는 스탯 포인트
// 방어하면 받는 피해가 방어력만큼 줄어요. 공격 · 방어 · 회복은 횟수 제한 없이 쓸 수 있어요.

// 캐릭터 꾸미기에서 고를 수 있는 것들
const LOOK = {
  skin:   ["#ffdbac", "#f1c27d", "#e0ac69", "#c68642", "#8d5524"],
  hair:   ["#1c1917", "#5b3a1e", "#b91c1c", "#f59e0b", "#d1d5db", "#2563eb", "#db2777"],
  style:  ["short", "spiky", "long", "cap", "band"],
  shirt:  ["#dc2626", "#ea580c", "#ca8a04", "#16a34a", "#0891b2", "#2563eb", "#7c3aed", "#ec4899", "#94a3b8", "#1f2937"],
  pants:  ["#334155", "#1e3a8a", "#7f1d1d", "#57534e", "#111827", "#166534"],
  weapon: ["sword", "axe", "hammer"]
};
const STYLE_NAMES = { short: "짧은 머리", spiky: "삐죽 머리", long: "긴 머리", cap: "모자", band: "머리띠" };
const WEAPON_NAMES = { sword: "칼", axe: "도끼", hammer: "망치" };
const TEAMS = ["🔴 빨강팀", "🔵 파랑팀"];
const ROOM_PREFIX = "vibe03-battle/";  // 다른 게임과 방 코드가 겹치지 않게 붙이는 말
// 친구들과 연결해 주는 무료 공개 서버 (모두 미리 연결해 두고 먼저 되는 쪽을 써요)
// 앞의 두 곳은 일반 https 포트(443)를 써서 학교 인터넷에서도 잘 막히지 않아요
const BROKERS = [
  { url: "wss://mqtt.eclipseprojects.io/mqtt" },
  { url: "wss://public.cloud.shiftr.io", username: "public", password: "public" },
  { url: "wss://broker.emqx.io:8084/mqtt" },
  { url: "wss://broker.hivemq.com:8884/mqtt" }
];
// ===============================
</script>
<style>
  :root { --t0: #dc2626; --t1: #2563eb; --line: #e2e8f0; --text: #0f172a; --sub: #64748b; --main: #4f46e5; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #f1f5f9; color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { text-align: center; margin: 8px 0 12px; font-size: 1.6rem; }
  h2 { margin: 0 0 10px; font-size: 1.2rem; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .center { text-align: center; }
  .sub { color: var(--sub); font-size: .9rem; }
  label.field { display: block; font-weight: bold; margin: 12px 0 6px; }
  input[type=text] { width: 100%; padding: 12px; font-size: 1.05rem; border: 2px solid var(--line); border-radius: 10px; }
  .btn { display: block; width: 100%; padding: 14px; font-size: 1.05rem; font-weight: bold; border: 0; border-radius: 10px; cursor: pointer; color: #fff; background: var(--main); margin-top: 10px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.gray { background: #64748b; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .mini { width: 20px; height: 28px; vertical-align: middle; }
  .notice { margin-top: 8px; text-align: center; font-weight: bold; color: #b45309; }
  .modes button { padding: 12px 0; font-size: 1.05rem; font-weight: bold; border-radius: 10px; border: 3px solid var(--line); background: #fff; cursor: pointer; }
  .modes button.on { border-color: var(--main); background: #eef2ff; color: var(--main); }
  .code { font-size: 2.6rem; font-weight: bold; letter-spacing: 8px; color: var(--main); margin: 4px 0; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .team { border-radius: 12px; padding: 10px; border: 2px solid; min-height: 120px; }
  .team.t0 { border-color: var(--t0); background: #fef2f2; }
  .team.t1 { border-color: var(--t1); background: #eff6ff; }
  .team div { padding: 3px 0; }
  .net { text-align: center; font-weight: bold; padding: 8px; border-radius: 10px; margin-bottom: 12px; background: #fef9c3; }
  .net.ok { background: #dcfce7; color: #166534; } .net.fail, .net.lib { background: #fee2e2; color: #991b1b; }
  .net small { font-weight: normal; }
  .qr { margin: 10px auto 4px; width: 180px; }
  .qr svg { width: 180px; height: 180px; display: block; }
  .err { color: #b91c1c; font-weight: bold; min-height: 1.3em; margin-top: 8px; text-align: center; }

  /* 캐릭터 꾸미기 */
  .preview { text-align: center; background: linear-gradient(#e0f2fe, #bbf7d0); border-radius: 14px; padding: 8px 0 0; }
  .preview svg { width: 120px; height: 172px; }
  .opt { margin-top: 10px; }
  .opt b { display: block; font-size: .9rem; margin-bottom: 4px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
  .sw.on { box-shadow: 0 0 0 3px var(--main); }
  .chip { padding: 8px 12px; border-radius: 999px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: bold; font-size: .9rem; }
  .chip.on { border-color: var(--main); background: #eef2ff; color: var(--main); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .stats button { padding: 8px 2px; border-radius: 10px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: bold; font-size: .9rem; line-height: 1.3; color: var(--text); }
  .stats button small { display: block; font-weight: normal; color: var(--sub); font-size: .75rem; }
  .stats button:disabled { opacity: .45; cursor: not-allowed; }
  .ptsbar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-weight: bold; }
  .ptsbar .left { color: #b45309; }
  .linkbtn { background: none; border: 0; color: var(--main); font-weight: bold; cursor: pointer; font-size: .9rem; }
  .readyrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
  .readyrow div { text-align: center; font-size: .8rem; font-weight: bold; }
  .readyrow .think { display: block; font-size: 2rem; height: 72px; line-height: 72px; }
  .readyrow svg { width: 50px; height: 72px; display: block; margin: 0 auto; }

  /* 싸움터: 위쪽(멀리)은 상대, 아래쪽(가까이)은 우리 편 */
  .arena { background: linear-gradient(#bae6fd 0%, #e0f2fe 34%, #bbf7d0 35%, #4ade80 100%); border-radius: 16px 16px 0 0; padding: 10px 6px 0;
    border: 2px solid var(--line); border-bottom: 0; min-height: 400px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .far-row, .near-row { display: flex; justify-content: center; align-items: flex-end; gap: 10px; }
  .far-row { gap: 18px; }
  .fighter { position: relative; text-align: center; border-radius: 12px; padding: 2px 4px; }
  .fighter.pickable { cursor: pointer; background: rgba(239, 68, 68, .18); outline: 3px dashed #ef4444; }
  .fighter .tag { font-size: .75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fighter.t0 .tag { color: var(--t0); } .fighter.t1 .tag { color: var(--t1); }
  .fighter .hpbar { height: 8px; margin-top: 2px; }
  .fighter .hpnum { font-size: .75rem; font-weight: bold; }
  .fighter .body { display: inline-block; line-height: 0; }
  .fighter .body svg { display: block; }
  .fighter.far { width: 76px; } .fighter.far .body svg { width: 46px; height: 66px; }
  .fighter.ally { width: 84px; } .fighter.ally .body svg { width: 66px; height: 95px; }
  .fighter.me .body svg { width: 140px; height: 200px; margin-bottom: -6px; }
  .fighter.enemy .body { transform: scaleX(-1); }
  .fighter .ready { font-size: .8rem; min-height: 1.1em; line-height: 1.1; }
  .fighter.me .ready { position: absolute; top: 4px; right: -6px; font-size: 1.4rem; }
  .fighter.dead .body { filter: grayscale(1); opacity: .45; transform: rotate(80deg) translateX(20%); }
  .fighter.enemy.dead .body { transform: scaleX(-1) rotate(80deg) translateX(20%); }
  .hpbar { height: 18px; background: #e5e7eb; border-radius: 10px; overflow: hidden; }
  .hpfill { height: 100%; transition: width .5s; }

  /* 아래쪽 내 상태 + 버튼 */
  .status { border-width: 3px; border-radius: 0 0 16px 16px; margin-top: 0; }
  .status.t0 { border-color: var(--t0); } .status.t1 { border-color: var(--t1); }
  .mystats { display: flex; justify-content: space-around; margin-top: 8px; font-weight: bold; font-size: .95rem; }
  .levelup { margin-top: 10px; padding: 10px; border-radius: 12px; background: #fef3c7; }
  .levelup .title { font-weight: bold; color: #b45309; text-align: center; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .acts button { padding: 10px 4px; min-height: 66px; font-size: 1.05rem; font-weight: bold; border: 0; border-radius: 12px; cursor: pointer; color: #fff; line-height: 1.3; }
  .acts button small { display: block; font-weight: normal; font-size: .8rem; opacity: .9; }
  .acts .cancel { grid-column: 1 / -1; min-height: 44px; }
  .atk { background: #ea580c; } .def { background: #0891b2; } .heal { background: #16a34a; } .cancel { background: #64748b; }

  /* 모션 */
  .arm { transform-box: fill-box; transform-origin: 50% 8%; }
  .anim-up .body, .anim-down .body { animation: lunge .7s; }
  .anim-up .body { --dy: -40px; } .anim-down .body { --dy: 30px; }
  .fighter.enemy.anim-down .body { animation: lungeFlip .7s; }
  .anim-up .arm, .anim-down .arm { animation: swing .7s; }
  .anim-hit .body { animation: shake .5s; filter: drop-shadow(0 0 12px #ef4444); }
  .fighter.enemy.anim-hit .body { animation: shakeFlip .5s; }
  .anim-heal .body { animation: glow 1s; filter: drop-shadow(0 0 14px #22c55e); }
  .fighter.enemy.anim-heal .body { animation: glowFlip 1s; }
  .shield { position: absolute; left: 50%; bottom: 25%; font-size: 3.4rem; transform: translate(-50%, 0); animation: pop 1.2s forwards; pointer-events: none; }
  .far .shield { font-size: 1.8rem; } .ally .shield { font-size: 2.4rem; }
  .float { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-weight: bold; font-size: 1.4rem; white-space: nowrap; animation: floatUp 1.3s forwards; pointer-events: none; text-shadow: 0 0 4px #fff, 0 0 4px #fff; }
  .me .float { font-size: 2rem; }
  .float.dmg { color: #dc2626; } .float.heal { color: #15803d; } .float.block { color: #0e7490; }
  @keyframes lunge { 40% { transform: translateY(var(--dy)) scale(1.12); } }
  @keyframes lungeFlip { 0%, 100% { transform: scaleX(-1); } 40% { transform: scaleX(-1) translateY(var(--dy)) scale(1.15); } }
  @keyframes swing { 30% { transform: rotate(-150deg); } 55% { transform: rotate(20deg); } }
  @keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
  @keyframes shakeFlip { 0%, 100% { transform: scaleX(-1); } 20% { transform: scaleX(-1) translateX(-8px); } 40% { transform: scaleX(-1) translateX(8px); } 60% { transform: scaleX(-1) translateX(-6px); } 80% { transform: scaleX(-1) translateX(6px); } }
  @keyframes glow { 50% { transform: scale(1.1); } }
  @keyframes glowFlip { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) scale(1.1); } }
  @keyframes pop { 0% { transform: translate(-50%, 0) scale(0); opacity: 0; } 25% { transform: translate(-50%, 0) scale(1.2); opacity: .95; } 80% { opacity: .95; } 100% { transform: translate(-50%, 0) scale(1); opacity: 0; } }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔️ 공격 방어 회복 대결</h1>
  <div id="app"></div>
</div>
<script>
const ACTS = {
  atk:  { label: "⚔️ 공격", cls: "atk" },
  def:  { label: "🛡️ 방어", cls: "def" },
  heal: { label: "💚 회복", cls: "heal" }
};
const STATS = {
  hp:   { label: "❤️ 체력" },
  atk:  { label: "⚔️ 공격" },
  def:  { label: "🛡️ 방어" },
  heal: { label: "💚 회복" }
};
const $ = id => document.getElementById(id);
const show = html => { $("app").innerHTML = html; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = n => Math.floor(Math.random() * n);

let net = null;                      // 지금 들어가 있는 방의 연결
let isHost = false, room = null;     // 방장만 가지고 있는 진짜 게임 상태
let view = null, myPid = null;       // 내 화면에 보이는 상태
let lastRound = 0, choosingTarget = false, queue = Promise.resolve();
let settings = { size: 1 };

// 이름과 마지막으로 꾸민 모습은 이 기기에 기억해 둬요
const randomLook = () => Object.fromEntries(Object.entries(LOOK).map(([k, arr]) => [k, rnd(arr.length)]));
let save = { name: "", look: randomLook() };
try { Object.assign(save, JSON.parse(localStorage.getItem("vibe03-battle-save")) || {}); } catch (e) {}
const saveNow = () => { try { localStorage.setItem("vibe03-battle-save", JSON.stringify(save)); } catch (e) {} };
const cleanLook = l => Object.fromEntries(Object.entries(LOOK).map(([k, arr]) => {
  const v = Number(l && l[k]);
  return [k, Number.isInteger(v) && v >= 0 && v < arr.length ? v : 0];
}));
save.look = cleanLook(save.look);
let me = { name: save.name || "" };
let draft = null;   // 캐릭터 꾸미기 중인 내용
let notice = "";

// QR로 들어오면 주소에 방 코드가 붙어 있어요 (…battle.html?code=AB12)
let joinCode = (new URLSearchParams(location.search).get("code") || "").toUpperCase().slice(0, 4);
if (joinCode) { notice = `📷 방 ${joinCode}에 들어가려면 이름을 쓰고 '들어가기'를 누르세요`; try { history.replaceState(null, "", location.pathname); } catch (e) {} }
function roomLink(code) { return location.href.split(/[?#]/)[0] + "?code=" + code; }
function qrImage(text) {
  if (typeof qrcode === "undefined") return "";   // QR 프로그램을 못 불러오면 코드만 보여줘요
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
}

// ---------- 사람 캐릭터 그리기 ----------
function person(look, cls = "") {
  const l = cleanLook(look);
  const skin = LOOK.skin[l.skin], hairC = LOOK.hair[l.hair], style = LOOK.style[l.style];
  const shirt = LOOK.shirt[l.shirt], pants = LOOK.pants[l.pants], weapon = LOOK.weapon[l.weapon];
  const top = "M30 38 Q30 15 50 15 Q70 15 70 38 Q66 26 50 26 Q34 26 30 38Z";
  const hair = {
    short: `<path d="${top}" fill="${hairC}"/>`,
    long:  `<path d="${top}" fill="${hairC}"/>`,
    spiky: `<path d="M30 37 L26 18 L37 25 L41 9 L50 22 L59 9 L63 25 L74 18 L70 37 Q66 26 50 26 Q34 26 30 37Z" fill="${hairC}"/>`,
    cap:   `<path d="${top}" fill="${hairC}"/><path d="M31 27 Q31 11 50 11 Q69 11 69 27Z" fill="${shirt}" stroke="#0003"/><path d="M62 24 L84 27 L64 29Z" fill="${shirt}" stroke="#0003"/>`,
    band:  `<path d="${top}" fill="${hairC}"/><rect x="30" y="25" width="40" height="6" rx="2" fill="${shirt}" stroke="#0003"/><path d="M70 27 L80 22 L79 32Z" fill="${shirt}"/>`
  }[style];
  const back = style === "long" ? `<path d="M28 34 Q28 14 50 14 Q72 14 72 34 L73 66 L27 66Z" fill="${hairC}"/>` : "";
  const tool = {
    sword:  `<path d="M72 94 L88 64" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/><path d="M72 94 L88 64" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M66 90 L79 97" stroke="#a16207" stroke-width="4" stroke-linecap="round"/>`,
    axe:    `<path d="M72 98 L86 60" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
      <path d="M82 58 Q98 52 98 70 Q90 66 84 70Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>`,
    hammer: `<path d="M72 98 L84 62" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
      <path d="M74 58 L90 52 L95 64 L79 70Z" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>`
  }[weapon];
  return `<svg class="${cls}" viewBox="0 -12 100 150">
    ${back}
    <rect x="37" y="96" width="11" height="34" rx="4" fill="${pants}"/><rect x="52" y="96" width="11" height="34" rx="4" fill="${pants}"/>
    <ellipse cx="41" cy="131" rx="8" ry="4" fill="#3f3f46"/><ellipse cx="59" cy="131" rx="8" ry="4" fill="#3f3f46"/>
    <g><rect x="23" y="60" width="10" height="32" rx="5" fill="${shirt}" stroke="#0002"/><circle cx="28" cy="94" r="5" fill="${skin}"/></g>
    <rect x="46" y="52" width="8" height="8" fill="${skin}"/>
    <rect x="32" y="57" width="36" height="42" rx="9" fill="${shirt}" stroke="#0002"/>
    <rect x="32" y="90" width="36" height="5" fill="#0003"/>
    <circle cx="50" cy="38" r="19" fill="${skin}"/>
    <circle cx="43" cy="40" r="2.6" fill="#111"/><circle cx="57" cy="40" r="2.6" fill="#111"/>
    <circle cx="39" cy="46" r="3" fill="#f8717155"/><circle cx="61" cy="46" r="3" fill="#f8717155"/>
    <path d="M45 48 Q50 52 55 48" stroke="#7f1d1d" stroke-width="2" fill="none" stroke-linecap="round"/>
    ${hair}
    <g class="arm">
      ${tool}
      <rect x="67" y="60" width="10" height="32" rx="5" fill="${shirt}" stroke="#0002"/><circle cx="72" cy="94" r="5" fill="${skin}"/>
    </g>
  </svg>`;
}

// ---------- 처음 메뉴 ----------
function menu(err = "") {
  leaveRoom();
  waiters = []; isHost = false; room = null; view = null; lastRound = 0; draft = null;
  show(`
    <div class="card">
      <label class="field" style="margin-top:0">내 이름</label>
      <input type="text" id="name" maxlength="8" placeholder="이름을 써 주세요" value="${esc(me.name)}">
      ${notice ? `<div class="notice">${notice}</div>` : ""}
    </div>
    <div class="net" id="net"></div>
    <div class="card">
      <h2>🚪 방 코드로 들어가기</h2>
      <div class="row">
        <input type="text" id="code" maxlength="4" placeholder="방 코드 4자리" style="text-transform:uppercase" value="${esc(joinCode)}">
        <button class="btn" style="margin:0;flex:0 0 110px" onclick="joinRoom()">들어가기</button>
      </div>
    </div>
    <div class="card">
      <h2>🏠 방 만들기</h2>
      <button class="btn" onclick="saveName(); createForm()">방 만들기</button>
    </div>
    <div class="err">${esc(err)}</div>`);
  showNet();
}
function showNet() {
  const el = $("net");
  if (!el) return;
  el.className = "net " + netState;
  el.innerHTML = {
    wait: "🟡 서버에 연결하는 중...",
    ok: "🟢 서버 연결됨",
    fail: "🔴 서버에 연결할 수 없어요<br><small>학교·회사 인터넷에서 막혔을 수 있어요. 휴대폰 데이터로 해 보세요.</small>",
    lib: "🔴 연결 프로그램을 불러오지 못했어요<br><small>인터넷이 연결되어 있는지 확인하고 새로고침해 보세요.</small>"
  }[netState];
}
function saveName() { const n = $("name"); if (n) { me.name = n.value.trim().slice(0, 8); save.name = me.name; saveNow(); } }

// ---------- 방 만들기 설정 ----------
function setSize(n) { settings.size = n; createForm(); }
function createForm() {
  const s = settings;
  show(`
    <div class="card">
      <h2>⚙️ 방 설정</h2>
      <label class="field">몇 대 몇?</label>
      <div class="row modes">${[1, 2, 3].map(n => `<button class="${s.size === n ? "on" : ""}" onclick="setSize(${n})">${n} 대 ${n}</button>`).join("")}</div>
      <button class="btn" id="makeBtn" onclick="createRoom()">방 만들기 완료</button>
      <button class="btn gray" onclick="menu()">뒤로</button>
      <div class="err" id="err"></div>
    </div>`);
}

// ---------- 연결 ----------
// 페이지가 열리자마자 서버에 미리 연결해 둬요. 그래서 방 만들기 · 들어가기가 빨라요.
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const myId = Math.random().toString(36).slice(2, 10);
const URLS = window.BROKER_TEST || BROKERS;   // BROKER_TEST는 테스트할 때만 써요
let brokers = [], waiters = [], netState = "wait";   // wait 연결 중 · ok 연결됨 · fail 서버 막힘 · lib 프로그램 못 불러옴
function connectBrokers() {
  if (typeof mqtt === "undefined") {   // 첫 번째 주소에서 못 불러오면 다른 주소에서 한 번 더
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js";
    sc.onload = connectBrokers;
    sc.onerror = () => { netState = "lib"; showNet(); };
    document.head.appendChild(sc);
    return;
  }
  setTimeout(() => { if (netState === "wait") { netState = "fail"; showNet(); } }, 12000);
  brokers = URLS.map((o, i) => {
    const b = { ready: false };
    b.client = mqtt.connect(o.url, { clientId: "vb" + myId + i, username: o.username, password: o.password, connectTimeout: 10000, reconnectPeriod: 3000 });
    b.client.on("connect", () => { b.ready = true; netState = "ok"; showNet(); waiters = waiters.filter(w => !w()); });
    b.client.on("close", () => { b.ready = false; if (!brokers.some(x => x.ready) && netState === "ok") { netState = "wait"; showNet(); } });
    b.client.on("message", (topic, buf) => onMessage(i, topic, buf));
    return b;
  });
}
// 서버가 준비되면 f(서버번호) 실행. want = -1 이면 먼저 준비된 아무 서버
function whenBroker(want, f, fail) {
  const w = () => {
    const i = want >= 0 ? want : brokers.findIndex(b => b.ready);
    if (i < 0 || !brokers[i] || !brokers[i].ready) return false;
    f(i); return true;
  };
  if (w()) return;
  waiters.push(w);
  setTimeout(() => { if (waiters.includes(w)) { waiters = waiters.filter(x => x !== w); fail(); } }, 12000);
}
const topic = (code, who) => ROOM_PREFIX + code + "/" + who;
function pub(to, m) { if (net) brokers[net.b].client.publish(topic(net.code, to), JSON.stringify(m), { qos: 1 }); }
function newCode(b) {   // 첫 글자로 어느 서버인지 알 수 있게 만들어요
  const n = URLS.length;
  const first = CODE_CHARS.split("").filter((c, i) => i % n === b);
  const pick = arr => arr[rnd(arr.length)];
  return pick(first) + Array.from({ length: 3 }, () => pick(CODE_CHARS)).join("");
}
const brokerOf = code => CODE_CHARS.indexOf(code[0]) % URLS.length;

function enterRoom(b, code, who, done) {   // 내 우편함을 열고 연결 확인(ping)을 시작해요
  net = { b, code, mine: topic(code, who), seen: {}, hostSeen: Date.now() };
  brokers[b].client.subscribe(net.mine, { qos: 1 }, () => done && done());
  net.timer = setInterval(heartbeat, 3000);
}
function leaveRoom() {
  if (!net) return;
  if (isHost) room.players.forEach(p => { if (p.pid !== "host") pub("p/" + p.pid, { t: "error", msg: "방장이 나갔어요." }); });
  else pub("host", { t: "leave", from: myId });
  brokers[net.b].client.unsubscribe(net.mine);
  clearInterval(net.timer);
  net = null;
}
function heartbeat() {
  if (!net) return;
  const now = Date.now();
  if (isHost) {
    room.players.forEach(p => {
      if (p.pid === "host" || p.gone) return;
      pub("p/" + p.pid, { t: "ping" });
      if (now - (net.seen[p.pid] || now) > 12000) playerLeft(p.pid);
    });
  } else {
    pub("host", { t: "ping", from: myId });
    if (now - net.hostSeen > 12000) menu("방장과 연결이 끊겼어요.");
  }
}
function onMessage(b, t, buf) {
  if (!net || net.b !== b || t !== net.mine) return;
  let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
  if (isHost) {
    const pid = String(m.from || "");
    if (!pid) return;
    net.seen[pid] = Date.now();
    if (m.t === "ping") return;
    if (m.t === "leave") return playerLeft(pid);
    hostHandle(pid, m, { send: x => pub("p/" + pid, x) });
  } else {
    net.hostSeen = Date.now();
    if (m.t === "state") { clearTimeout(net.joinTimer); receive(m.v); }
    if (m.t === "error") menu(m.msg);
  }
}
window.addEventListener("pagehide", leaveRoom);

// ---------- 방장: 방 열기 ----------
function createRoom() {
  $("makeBtn").disabled = true;
  $("err").textContent = "방을 여는 중...";
  whenBroker(-1, b => {
    isHost = true; myPid = "host";
    const code = newCode(b);
    room = { code, s: { size: settings.size }, phase: "lobby", round: 0, roundNo: 0, events: [], players: [] };
    room.players.push(newPlayer("host", me.name, 0, null));
    enterRoom(b, code, "host", sync);
  }, () => menu("서버에 연결할 수 없어요. 학교·회사 인터넷에서 막혔을 수 있어요."));
}

function newPlayer(pid, name, team, conn) {
  return { pid, name: name || "이름없음", team, conn, look: randomLook(), ready: false,
    st: { ...BASE }, hp: 0, pts: 0, pick: null, target: null, gone: false };
}
const P = pid => room.players.find(p => p.pid === pid);
const active = p => p.hp > 0 && !p.gone;
const teamCount = t => room.players.filter(p => p.team === t).length;

function hostHandle(pid, m, conn) {
  const p = P(pid);
  if (m.t === "join") {
    if (p) return;
    if (room.phase !== "lobby") return conn.send({ t: "error", msg: "이미 게임이 시작된 방이에요." });
    if (room.players.length >= room.s.size * 2) return conn.send({ t: "error", msg: "방이 꽉 찼어요." });
    const team = teamCount(0) <= teamCount(1) ? 0 : 1;
    room.players.push(newPlayer(pid, String(m.name || "").slice(0, 8), team, conn));
  } else if (!p) {
    return;
  } else if (m.t === "team" && room.phase === "lobby") {
    if (teamCount(1 - p.team) < room.s.size) p.team = 1 - p.team;
  } else if (m.t === "start" && pid === "host" && room.phase === "lobby") {
    if (teamCount(0) !== room.s.size || teamCount(1) !== room.s.size) return;
    room.phase = "custom";
    room.players.forEach(q => { q.ready = false; });
  } else if (m.t === "ready" && room.phase === "custom" && !p.ready) {
    // 꾸민 모습과 처음 스탯 포인트를 받아요
    const alloc = m.alloc || {};
    const add = Object.fromEntries(Object.keys(STAT_UP).map(k => [k, Math.max(0, Math.floor(Number(alloc[k]) || 0))]));
    if (Object.values(add).reduce((a, b) => a + b, 0) > START_POINTS) return;
    p.look = cleanLook(m.look);
    p.st = Object.fromEntries(Object.keys(BASE).map(k => [k, BASE[k] + add[k] * STAT_UP[k]]));
    p.ready = true;
    if (room.players.every(q => q.ready || q.gone)) return startBattle();
  } else if (m.t === "stat" && room.phase === "battle") {
    if (!active(p) || p.pts <= 0 || !STAT_UP[m.key]) return;
    p.pts--; p.st[m.key] += STAT_UP[m.key];
    if (m.key === "hp") p.hp += STAT_UP.hp;
  } else if (m.t === "again" && pid === "host" && room.phase === "over") {
    room.players = room.players.filter(q => !q.gone);
    room.phase = "lobby";
  } else if (m.t === "pick" && room.phase === "battle") {
    if (!active(p) || p.pick || !ACTS[m.act]) return;
    let target = null;
    if (m.act === "atk") {
      const foes = room.players.filter(q => q.team !== p.team && active(q));
      target = foes.length === 1 ? foes[0].pid : m.target;
      if (!foes.some(q => q.pid === target)) return;
    }
    p.pick = m.act; p.target = target;
    if (room.players.filter(active).every(q => q.pick)) return resolve();
  }
  sync();
}

function startBattle() {
  room.phase = "battle"; room.round = 1; room.roundNo = 0; room.events = [];
  room.players.forEach(p => { if (!p.gone) p.hp = p.st.hp; p.pts = 0; p.pick = null; p.target = null; });
  checkEnd();
  sync();
}

function resolve() {
  const ev = [];
  const acting = room.players.filter(p => active(p) && p.pick);
  // 1) 회복과 방어
  acting.forEach(p => {
    if (p.pick === "heal") { const amt = Math.min(p.st.hp, p.hp + p.st.heal) - p.hp; p.hp += amt; ev.push({ k: "heal", who: p.pid, amt }); }
    if (p.pick === "def") ev.push({ k: "def", who: p.pid });
  });
  // 2) 공격 (상대가 방어하면 방어력만큼 피해가 줄어요)
  const dmg = {};
  acting.filter(p => p.pick === "atk").forEach(p => {
    const t = P(p.target);
    const d = t.pick === "def" ? Math.max(0, p.st.atk - t.st.def) : p.st.atk;
    dmg[t.pid] = (dmg[t.pid] || 0) + d;
    ev.push({ k: "atk", who: p.pid, to: t.pid, dmg: d, guard: t.pick === "def" });
  });
  room.players.forEach(p => { p.hp = Math.max(0, p.hp - (dmg[p.pid] || 0)); p.pick = null; p.target = null; });
  // 3) 라운드가 끝나면 살아 있는 사람은 스탯 포인트를 받아요
  room.players.forEach(p => { if (active(p)) p.pts += ROUND_POINTS; });
  room.events = ev; room.roundNo++; room.round++;
  checkEnd();
  sync();
}

// 한 팀이 모두 쓰러지면 끝나요 (라운드 제한 없음)
function checkEnd() {
  const down = [0, 1].some(t => !room.players.some(p => p.team === t && active(p)));
  if (!down) return;
  room.phase = "over";
  room.totals = [0, 1].map(t => room.players.filter(p => p.team === t).reduce((a, p) => a + p.hp, 0));
  room.winner = room.totals[0] === room.totals[1] ? -1 : room.totals[0] > room.totals[1] ? 0 : 1;
}

function playerLeft(pid) {
  if (!room) return;
  const p = P(pid);
  if (!p) return;
  if (room.phase === "lobby") room.players = room.players.filter(q => q !== p);
  else {
    p.gone = true; p.hp = 0; p.pick = null;
    if (room.phase === "custom" && room.players.every(q => q.ready || q.gone)) return startBattle();
    if (room.phase === "battle") {
      checkEnd();
      if (room.phase === "battle" && room.players.filter(active).every(q => q.pick)) return resolve();
    }
  }
  sync();
}

// 사람마다 보여줄 것만 골라서 보내요 (다른 사람의 스탯과 고른 행동은 비밀)
function viewFor(pid) {
  const p = P(pid);
  return {
    me: pid, code: room.code, s: room.s, phase: room.phase, round: room.round,
    roundNo: room.roundNo, events: room.events, totals: room.totals, winner: room.winner,
    players: room.players.map(q => ({ pid: q.pid, name: q.name, team: q.team, look: q.look, ready: q.ready,
      hp: q.hp, max: q.st.hp, picked: !!q.pick, gone: q.gone })),
    mySt: { ...p.st }, myPts: p.pts, myPick: p.pick
  };
}
function sync() {
  room.players.forEach(p => { if (p.conn && !p.gone) p.conn.send({ t: "state", v: viewFor(p.pid) }); });
  receive(viewFor("host"));
}

// ---------- 참가자: 방 들어가기 ----------
function joinRoom() {
  saveName();
  const code = $("code").value.trim().toUpperCase();
  joinCode = ""; notice = "";
  if (code.length !== 4) return menu("방 코드 4자리를 써 주세요.");
  show(`<div class="card center"><h2>🔌 방 ${esc(code)}에 들어가는 중...</h2></div>`);
  const b = brokerOf(code);
  if (b < 0) return menu("그런 방이 없어요. 방 코드를 확인해 주세요.");
  whenBroker(b, () => {
    enterRoom(b, code, "p/" + myId, () => {
      net.joinTimer = setTimeout(() => menu("그런 방이 없어요. 방 코드를 확인해 주세요."), 6000);
      pub("host", { t: "join", from: myId, name: me.name });
    });
  }, () => menu("서버에 연결할 수 없어요. 학교·회사 인터넷에서 막혔을 수 있어요."));
}

function send(m) { if (isHost) hostHandle("host", m); else pub("host", { ...m, from: myId }); }

// ---------- 화면 ----------
function receive(v) {
  queue = queue.then(() => {
    myPid = v.me;
    const animate = v.roundNo > lastRound && v.events.length && view && view.phase === "battle";
    lastRound = v.roundNo;
    if (!animate) { view = v; render(); return; }
    return playEvents(v.events).then(() => { view = v; choosingTarget = false; render(); });
  });
}

function render() {
  const v = view;
  if (v.phase === "lobby") return renderLobby(v);
  if (v.phase === "custom") return renderCustom(v);
  renderBattle(v);
}

function renderLobby(v) {
  const full = [0, 1].every(t => v.players.filter(p => p.team === t).length === v.s.size);
  const team = t => `<div class="team t${t}"><b>${TEAMS[t]}</b> <span class="sub">${v.players.filter(p => p.team === t).length}/${v.s.size}</span>
    ${v.players.filter(p => p.team === t).map(p => `<div>${esc(p.name)}${p.pid === "host" ? " 👑" : ""}${p.pid === myPid ? " ⭐" : ""}</div>`).join("")}</div>`;
  show(`
    <div class="card center">
      <div class="sub">방 코드</div>
      <div class="code">${v.code}</div>
      <div class="qr">${qrImage(roomLink(v.code))}</div>
      <div class="sub">휴대폰 카메라로 찍으면 바로 들어올 수 있어요</div>
      <div class="sub">${v.s.size} 대 ${v.s.size}</div>
    </div>
    <div class="card">
      <div class="teams">${team(0)}${team(1)}</div>
      <button class="btn gray" onclick="send({t:'team'})">팀 바꾸기</button>
      ${isHost
        ? `<button class="btn" ${full ? "" : "disabled"} onclick="send({t:'start'})">▶ 시작</button>
           <div class="sub center" style="margin-top:6px">${full ? "모두 모였어요! 시작하면 캐릭터를 꾸며요." : `팀마다 ${v.s.size}명씩 모이면 시작할 수 있어요.`}</div>`
        : `<div class="sub center" style="margin-top:10px">방장이 시작하기를 기다리는 중... ⏳</div>`}
      <button class="btn gray" onclick="menu()">나가기</button>
    </div>`);
}

// ---------- 캐릭터 꾸미기 (시작 버튼을 누른 뒤) ----------
function renderCustom(v) {
  const meP = v.players.find(p => p.pid === myPid);
  if (meP.ready) {
    show(`
      <div class="card center">
        <h2>✅ 준비 완료!</h2>
        <div class="sub">다른 사람이 꾸미기를 끝내면 바로 시작해요</div>
        <div class="readyrow">${v.players.filter(p => !p.gone).map(p =>
          `<div style="color:var(--t${p.team})">${p.ready ? person(p.look) : `<span class="think">💭</span>`}${esc(p.name)}<br>${p.ready ? "✅" : "꾸미는 중"}</div>`).join("")}</div>
      </div>`);
    return;
  }
  if (!draft) draft = { look: { ...save.look }, alloc: { hp: 0, atk: 0, def: 0, heal: 0 } };
  const used = Object.values(draft.alloc).reduce((a, b) => a + b, 0);
  const swatch = key => LOOK[key].map((c, i) =>
    `<button class="sw ${draft.look[key] === i ? "on" : ""}" style="background:${c}" onclick="setLook('${key}',${i})"></button>`).join("");
  const chips = (key, names) => LOOK[key].map((n, i) =>
    `<button class="chip ${draft.look[key] === i ? "on" : ""}" onclick="setLook('${key}',${i})">${names[n]}</button>`).join("");
  show(`
    <div class="card">
      <h2>🎨 내 캐릭터 꾸미기</h2>
      <div class="preview">${person(draft.look)}</div>
      <div class="opt"><b>피부</b><div class="swatches">${swatch("skin")}</div></div>
      <div class="opt"><b>머리 모양</b><div class="swatches">${chips("style", STYLE_NAMES)}</div></div>
      <div class="opt"><b>머리색</b><div class="swatches">${swatch("hair")}</div></div>
      <div class="opt"><b>옷</b><div class="swatches">${swatch("shirt")}</div></div>
      <div class="opt"><b>바지</b><div class="swatches">${swatch("pants")}</div></div>
      <div class="opt"><b>무기</b><div class="swatches">${chips("weapon", WEAPON_NAMES)}</div></div>
      <button class="linkbtn" onclick="draft.look=randomLook();render()">🎲 아무거나</button>
    </div>
    <div class="card">
      <h2>📈 처음 스탯 찍기</h2>
      <div class="ptsbar"><span class="left">⭐ 남은 포인트 ${START_POINTS - used}</span>
        <button class="linkbtn" onclick="draft.alloc={hp:0,atk:0,def:0,heal:0};render()">다시 찍기</button></div>
      <div class="stats">${Object.entries(STATS).map(([k, s]) =>
        `<button ${used >= START_POINTS ? "disabled" : ""} onclick="draft.alloc.${k}++;render()">${s.label}<br>${BASE[k] + draft.alloc[k] * STAT_UP[k]}<small>+${STAT_UP[k]}</small></button>`).join("")}</div>
      <button class="btn" onclick="readyUp()">준비 완료</button>
    </div>`);
}
function setLook(key, i) { draft.look[key] = i; render(); }
function readyUp() {
  save.look = { ...draft.look }; saveNow();
  send({ t: "ready", look: draft.look, alloc: draft.alloc });
}

function hpColor(pct) { return pct > 50 ? "#22c55e" : pct > 25 ? "#f59e0b" : "#ef4444"; }
function hpBar(hp, max) {
  const pct = Math.min(100, hp / max * 100);
  return `<div class="hpbar"><div class="hpfill" style="width:${pct}%;background:${hpColor(pct)}"></div></div>`;
}

// where: far(멀리 있는 상대) · ally(우리 팀) · me(나)
function fighter(p, v, myTeam, where) {
  const enemy = p.team !== myTeam;
  const pickable = enemy && choosingTarget && p.hp > 0 && !p.gone;
  const mark = p.gone ? "📴 나감" : p.hp <= 0 ? "💀" : v.phase !== "battle" ? "" : p.picked ? "✅" : "💭";
  return `<div class="fighter ${where} t${p.team} ${enemy ? "enemy" : ""} ${p.hp <= 0 ? "dead" : ""} ${pickable ? "pickable" : ""}"
      data-pid="${p.pid}" ${pickable ? `onclick="attack('${p.pid}')"` : ""}>
    ${where === "me" ? "" : `<div class="tag">${esc(p.name)}</div>${hpBar(p.hp, p.max)}<div class="hpnum">❤️ ${p.hp}</div>`}
    <div class="body">${person(p.look)}</div>
    <div class="ready">${mark}</div>
  </div>`;
}

function renderBattle(v) {
  const meP = v.players.find(p => p.pid === myPid);
  const myTeam = meP.team, st = v.mySt;
  const foes = v.players.filter(p => p.team !== myTeam);
  const allies = v.players.filter(p => p.team === myTeam && p.pid !== myPid);
  const aliveFoes = foes.filter(p => p.hp > 0 && !p.gone);
  const waiting = v.players.filter(p => p.hp > 0 && !p.gone);
  const left = allies.slice(0, Math.ceil(allies.length / 2)), right = allies.slice(left.length);
  const alive = meP.hp > 0 && !meP.gone;

  let panel;
  if (v.phase === "over") {
    const win = v.winner === -1 ? "🤝 무승부!" : v.winner === myTeam ? "🏆 승리!" : "😢 패배...";
    const who = v.winner === -1 ? "" : v.s.size === 1 ? `${esc(v.players.find(p => p.team === v.winner).name)} 이겼어요` : `${TEAMS[v.winner]} 이겼어요`;
    panel = `<div class="center"><h2 style="font-size:1.7rem">${win}</h2>
      <div>${who}</div>
      <div class="sub">${v.round - 1}라운드 · 남은 체력 ${TEAMS[0]} ${v.totals[0]} : ${v.totals[1]} ${TEAMS[1]}</div>
      ${isHost ? `<button class="btn" onclick="send({t:'again'})">같은 방에서 다시 하기</button>` : `<div class="sub" style="margin-top:8px">방장이 다시 시작하면 같이 할 수 있어요.</div>`}
      <button class="btn gray" onclick="menu()">처음 메뉴로</button></div>`;
  } else if (!alive) {
    panel = `<div class="center"><h2>💀 쓰러졌어요</h2><div class="sub">우리 팀을 응원해 주세요!</div></div>`;
  } else if (v.myPick) {
    panel = `<div class="center"><h2>✅ ${ACTS[v.myPick].label}!</h2>
      <div class="sub">다른 사람을 기다리는 중... ${waiting.filter(p => p.picked).length}/${waiting.length}</div></div>`;
  } else if (choosingTarget) {
    panel = `<div class="center"><b>누구를 공격할까요? 🎯</b></div><div class="acts">
      ${aliveFoes.map(p => `<button class="atk" onclick="attack('${p.pid}')">🎯 ${esc(p.name)}<small>❤️ ${p.hp}</small></button>`).join("")}
      <button class="cancel" onclick="choosingTarget=false;render()">취소</button></div>`;
  } else {
    panel = `<div class="acts">
      <button class="atk" onclick="choose('atk')">${ACTS.atk.label}<small>피해 ${st.atk}</small></button>
      <button class="def" onclick="choose('def')">${ACTS.def.label}<small>피해 -${st.def}</small></button>
      <button class="heal" onclick="choose('heal')">${ACTS.heal.label}<small>+${st.heal}</small></button></div>`;
  }
  // 라운드가 지나면 받은 스탯 포인트를 찍어요
  const levelup = v.phase === "battle" && alive && v.myPts > 0 ? `
    <div class="levelup"><div class="title">⭐ 스탯 포인트 ${v.myPts}개! 올릴 스탯을 눌러요</div>
      <div class="stats">${Object.entries(STATS).map(([k, s]) =>
        `<button onclick="statUp('${k}')">${s.label}<small>+${STAT_UP[k]}</small></button>`).join("")}</div></div>` : "";

  show(`
    <div class="center" style="font-weight:bold;margin-bottom:8px">${v.phase === "over" ? "게임 끝!" : `라운드 ${v.round}`}</div>
    <div class="arena">
      <div class="far-row">${foes.map(p => fighter(p, v, myTeam, "far")).join("")}</div>
      <div class="near-row">${left.map(p => fighter(p, v, myTeam, "ally")).join("")}${fighter(meP, v, myTeam, "me")}${right.map(p => fighter(p, v, myTeam, "ally")).join("")}</div>
    </div>
    <div class="card status t${myTeam}">
      <div style="display:flex;justify-content:space-between;font-weight:bold">
        <span>${esc(meP.name)} · 내 상태</span><span>❤️ ${meP.hp} / ${meP.max}</span></div>
      <div style="margin-top:6px">${hpBar(meP.hp, meP.max)}</div>
      <div class="mystats"><span>⚔️ ${st.atk}</span><span>🛡️ ${st.def}</span><span>💚 ${st.heal}</span></div>
      ${levelup}
      ${panel}
    </div>`);
}

function statUp(key) {
  // 화면에 바로 보이게 먼저 올리고, 방장에게 알려요
  view.myPts--; view.mySt[key] += STAT_UP[key];
  if (key === "hp") { const meP = view.players.find(p => p.pid === myPid); meP.max += STAT_UP.hp; meP.hp += STAT_UP.hp; }
  render(); send({ t: "stat", key });
}
function picked(m) { view.myPick = m.act; choosingTarget = false; render(); send(m); }
function choose(act) {
  if (act !== "atk") return picked({ t: "pick", act });
  const foes = view.players.filter(p => p.team !== view.players.find(q => q.pid === myPid).team && p.hp > 0 && !p.gone);
  if (foes.length === 1) return attack(foes[0].pid);
  choosingTarget = true; render();
}
function attack(target) { picked({ t: "pick", act: "atk", target }); }

// ---------- 모션 ----------
const wait = ms => new Promise(r => setTimeout(r, ms));
const el = pid => document.querySelector(`.fighter[data-pid="${pid}"]`);
function floatText(f, text, cls) {
  if (!f) return;
  const s = document.createElement("span");
  s.className = "float " + cls; s.textContent = text;
  f.appendChild(s);
}
async function playEvents(ev) {
  ev.forEach(e => {
    const f = el(e.who);
    if (!f) return;
    if (e.k === "heal") { f.classList.add("anim-heal"); floatText(f, e.amt > 0 ? "+" + e.amt : "체력 가득!", "heal"); }
    if (e.k === "def") { const s = document.createElement("span"); s.className = "shield"; s.textContent = "🛡️"; f.appendChild(s); }
  });
  await wait(350);
  const myTeam = view.players.find(p => p.pid === myPid).team;
  const atks = ev.filter(e => e.k === "atk");
  atks.forEach(e => {
    const a = el(e.who);
    if (a) a.classList.add(view.players.find(p => p.pid === e.who).team === myTeam ? "anim-up" : "anim-down");
  });
  await wait(300);
  atks.forEach(e => {
    const t = el(e.to);
    if (!t) return;
    if (e.dmg > 0) { t.classList.add("anim-hit"); floatText(t, "-" + e.dmg, "dmg"); }
    else floatText(t, "막음!", "block");
  });
  await wait(1000);
}

connectBrokers();
menu();
</script>
</body>
</html>
