<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공격 방어 회복 대결</title>
<script>
// ===== 여기만 고치면 돼요 =====
const MAX_HP = 100;       // 처음 체력 (최대 체력)
const USES = 5;           // 공격 · 방어 · 회복 각각 쓸 수 있는 횟수
const ATTACK = 25;        // 공격 피해
const DEFEND = 20;        // 방어하면 줄어드는 피해
const HEAL = 15;          // 회복량
const NAMES = ["🔴 플레이어 1", "🔵 플레이어 2"];
// ===============================
</script>
<style>
  :root { --p1: #dc2626; --p2: #2563eb; --line: #e2e8f0; --text: #0f172a; --sub: #64748b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #f1f5f9; color: var(--text); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { text-align: center; margin: 8px 0 4px; font-size: 1.6rem; }
  .rule { text-align: center; color: var(--sub); margin: 0 0 16px; font-size: .95rem; line-height: 1.5; }
  .round { text-align: center; font-weight: bold; margin-bottom: 12px; }
  .card { background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card.p0 { border-color: var(--p1); }
  .card.p1 { border-color: var(--p2); }
  .name { font-weight: bold; font-size: 1.15rem; margin-bottom: 8px; }
  .small { font-size: .9rem; color: var(--sub); font-weight: normal; }
  .hpbar { height: 22px; background: #e5e7eb; border-radius: 11px; overflow: hidden; }
  .hpfill { height: 100%; transition: width .4s; }
  .hptext { margin: 6px 0 12px; font-weight: bold; }
  .btns { display: grid; gap: 8px; }
  .btns button, .big { padding: 14px; font-size: 1.05rem; font-weight: bold; border: 0; border-radius: 10px; cursor: pointer; color: #fff; width: 100%; }
  .btns button:disabled { opacity: .35; cursor: not-allowed; }
  .atk { background: #ea580c; } .def { background: #0891b2; } .heal { background: #16a34a; }
  .big { background: #4f46e5; margin-top: 12px; }
  .center { text-align: center; line-height: 1.7; }
  .center h2 { margin: 4px 0 10px; }
  .home { display: block; text-align: center; margin-top: 18px; color: #4f46e5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔️ 공격 방어 회복 대결</h1>
  <p class="rule" id="rule"></p>
  <div class="round" id="round"></div>
  <div id="screen"></div>
  <a class="home" href="index.html">← 처음으로</a>
</div>
<script>
const ACTIONS = [
  { id: "atk", label: "⚔️ 공격", cls: "atk" },
  { id: "def", label: "🛡️ 방어", cls: "def" },
  { id: "heal", label: "💚 회복", cls: "heal" }
];
let players, round, over, turn, lastResult;

document.getElementById("rule").innerHTML =
  `공격 · 방어 · 회복은 <b>각각 ${USES}번</b>까지만! 상대가 몇 번 남았는지는 비밀이에요 🤫<br>` +
  `공격 ${ATTACK} 피해 · 방어하면 피해 ${DEFEND} 줄임 · 회복 +${HEAL}<br>` +
  `체력이 0이 되거나 기회를 다 쓰면 끝! <b>체력이 더 많은 사람이 승리</b> 🏆`;

function start() {
  players = [0, 1].map(() => ({ hp: MAX_HP, left: { atk: USES, def: USES, heal: USES }, pick: null }));
  round = 1; over = false; lastResult = "";
  showHandoff(0);
}

function hpBar(hp) {
  const pct = Math.max(0, hp) / MAX_HP * 100;
  const color = pct > 50 ? "#22c55e" : pct > 25 ? "#f59e0b" : "#ef4444";
  return `<div class="hpbar"><div class="hpfill" style="width:${pct}%;background:${color}"></div></div>
    <div class="hptext">❤️ ${Math.max(0, hp)} / ${MAX_HP}</div>`;
}

function setRound() {
  document.getElementById("round").textContent = over ? "게임 끝!" : `라운드 ${round} / ${USES * 3}`;
}

// 화면 넘기기: 다른 사람이 볼 수 없도록 가림막
function showHandoff(i) {
  turn = i;
  setRound();
  const other = NAMES[1 - i];
  document.getElementById("screen").innerHTML = `
    ${lastResult}
    <div class="card p${i} center">
      <h2>${NAMES[i]} 차례</h2>
      <div>${other}은(는) 화면을 보지 마세요 🙈</div>
      <button class="big" onclick="showPick(${i})">내 화면 보기</button>
    </div>`;
}

// 내 화면: 내 체력 + 내 남은 기회, 상대는 체력만
function showPick(i) {
  const me = players[i], op = players[1 - i];
  const btns = ACTIONS.map(a =>
    `<button class="${a.cls}" onclick="pick(${i},'${a.id}')" ${me.left[a.id] <= 0 ? "disabled" : ""}>
      ${a.label} (${me.left[a.id]}번 남음)</button>`).join("");
  document.getElementById("screen").innerHTML = `
    <div class="card p${1 - i}">
      <div class="name">${NAMES[1 - i]} <span class="small">(상대)</span></div>
      ${hpBar(op.hp)}
      <div class="small">남은 기회: 🤫 비밀</div>
    </div>
    <div class="card p${i}">
      <div class="name">${NAMES[i]} <span class="small">(나)</span></div>
      ${hpBar(me.hp)}
      <div class="btns">${btns}</div>
    </div>`;
}

function pick(i, id) {
  const p = players[i];
  if (over || p.pick || p.left[id] <= 0) return;
  p.pick = id;
  p.left[id]--;
  if (i === 0) { lastResult = ""; showHandoff(1); }
  else resolve();
}

function resolve() {
  const before = players.map(p => p.hp);
  // 1) 회복 먼저
  players.forEach(p => { if (p.pick === "heal") p.hp = Math.min(MAX_HP, p.hp + HEAL); });
  // 2) 공격 (상대가 방어하면 피해 줄임)
  const dmg = players.map((p, i) => {
    const attacker = players[1 - i];
    if (attacker.pick !== "atk") return 0;
    return p.pick === "def" ? Math.max(0, ATTACK - DEFEND) : ATTACK;
  });
  players.forEach((p, i) => p.hp -= dmg[i]);

  // 결과는 체력 변화만 보여줘요 (무엇을 골랐는지는 비밀)
  const changes = players.map((p, i) => {
    const d = Math.max(0, p.hp) - before[i];
    return `${NAMES[i]} ❤️ ${d > 0 ? "+" + d : d === 0 ? "변화 없음" : d} → ${Math.max(0, p.hp)}`;
  });
  lastResult = `<div class="card center"><b>라운드 ${round} 결과</b><br>${changes.join("<br>")}</div>`;

  players.forEach(p => p.pick = null);
  round++;
  // 3) 끝났는지 확인: 누가 쓰러졌거나, 기회를 다 썼을 때
  const down = players.some(p => p.hp <= 0);
  const noChance = players.some(p => p.left.atk + p.left.def + p.left.heal === 0);
  if (down || noChance) finish(down ? "체력이 0이 되었어요." : "기회를 모두 썼어요.");
  else showHandoff(0);
}

function finish(why) {
  over = true;
  setRound();
  const [a, b] = players.map(p => Math.max(0, p.hp));
  const title = a === b ? "🤝 무승부!" : `🏆 ${a > b ? NAMES[0] : NAMES[1]} 승리!`;
  document.getElementById("screen").innerHTML = `
    ${lastResult}
    <div class="card center" style="border-color:#facc15">
      <h2>${title}</h2>
      <div>${why} 최종 체력 ${a} : ${b}</div>
      <button class="big" onclick="start()">다시 하기</button>
    </div>`;
}

start();
</script>
</body>
</html>
