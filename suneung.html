<script>
// ---------- 작은 도구들 ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = n => Math.floor(Math.random() * n);
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => a + rnd(b - a + 1);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const num = (v, d = 0) => (typeof v === "number" && isFinite(v)) ? v : d;
const r2 = v => Math.round(v * 100) / 100;
const IS_TOUCH = "ontouchstart" in window || navigator.maxTouchPoints > 0;
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const CIRCLED = ["①", "②", "③", "④", "⑤"];
function show(html, over) { const u = $("ui"); u.style.display = "block"; u.className = over ? "over" : ""; u.innerHTML = `<div class="wrap">${html}</div>`; }
function hideUI() { $("ui").style.display = "none"; }
let toastTimer = 0;
function toast(msg, ms = 1800) { const t = $("toast"); t.innerHTML = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms); }

// 이름은 이 기기에 기억해 둬요
let me = { name: "" };
try { me.name = (JSON.parse(localStorage.getItem("vibe03-suneung")) || {}).name || ""; } catch (e) {}
function saveName() {
  const n = $("name"); if (!n) return;
  me.name = n.value.trim().slice(0, 8);
  try { localStorage.setItem("vibe03-suneung", JSON.stringify({ name: me.name })); } catch (e) {}
}
const cleanName = n => String(n || "").trim().slice(0, 8);

// QR로 들어오면 주소에 방 코드가 붙어 있어요 (…suneung.html?code=AB12)
let joinCode = (new URLSearchParams(location.search).get("code") || "").toUpperCase().slice(0, 4);
let notice = joinCode ? `📷 방 <b>${esc(joinCode)}</b>에 들어가려면 이름을 쓰고 '방 들어가기'를 누르세요` : "";
if (joinCode) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
const roomLink = code => location.href.split(/[?#]/)[0] + "?code=" + code;
function qrImage(text) {
  if (typeof qrcode === "undefined") return "";
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

// ---------- 소리 ----------
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, dur, type = "sine", vol = 0.2, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol = 0.3, hp = 1500) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const SND = {
  bell() { tone(784, 1.2, "sine", 0.25); tone(659, 1.4, "sine", 0.25, 0.55); },
  smash() { noise(0.35, 0.5, 900); for (let i = 0; i < 7; i++) tone(2400 + Math.random() * 2600, 0.15, "triangle", 0.06, 0.05 + i * 0.05); },
  wrong() { tone(160, 0.45, "square", 0.12); },
  ok() { tone(880, 0.12, "sine", 0.15); tone(1320, 0.18, "sine", 0.15, 0.1); },
  bad() { tone(220, 0.25, "sawtooth", 0.1); },
  step(v) { tone(90 + Math.random() * 30, 0.06, "triangle", 0.05 + v * 0.25); },
  alarm() { for (let i = 0; i < 4; i++) tone(i % 2 ? 660 : 880, 0.2, "square", 0.1, i * 0.22); }
};

// ---------- 연결 (공개 MQTT 서버로 친구들과 이어져요) ----------
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const myId = Math.random().toString(36).slice(2, 10);
const URLS = window.BROKER_TEST || BROKERS;   // BROKER_TEST는 테스트할 때만 써요
let brokers = [], waiters = [], netState = "wait", net = null, isHost = false, joined = false;
function connectBrokers() {
  if (typeof mqtt === "undefined") {
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js";
    sc.onload = connectBrokers;
    sc.onerror = () => { netState = "lib"; showNet(); };
    document.head.appendChild(sc);
    return;
  }
  setTimeout(() => { if (netState === "wait") { netState = "fail"; showNet(); } }, 12000);
  brokers = URLS.map((o, i) => {
    const b = { ready: false };
    b.client = mqtt.connect(o.url, { clientId: "sn" + myId + i, username: o.username, password: o.password, connectTimeout: 10000, reconnectPeriod: 3000 });
    b.client.on("connect", () => { b.ready = true; netState = "ok"; showNet(); waiters = waiters.filter(w => !w()); });
    b.client.on("close", () => { b.ready = false; if (!brokers.some(x => x.ready) && netState === "ok") { netState = "wait"; showNet(); } });
    b.client.on("message", (t, buf) => onMessage(i, t, buf));
    return b;
  });
}
function whenBroker(want, f, fail) {
  const w = () => {
    const i = want >= 0 ? want : brokers.findIndex(b => b.ready);
    if (i < 0 || !brokers[i] || !brokers[i].ready) return false;
    f(i); return true;
  };
  if (w()) return;
  waiters.push(w);
  setTimeout(() => { if (waiters.includes(w)) { waiters = waiters.filter(x => x !== w); fail(); } }, 12000);
}
const topic = (code, who) => ROOM_PREFIX + code + "/" + who;
function pub(to, m, fast) { if (net) brokers[net.b].client.publish(topic(net.code, to), JSON.stringify(m), { qos: fast ? 0 : 1 }); }
function newCode(b) {   // 첫 글자로 어느 서버인지 알 수 있게 만들어요
  const first = CODE_CHARS.split("").filter((c, i) => i % URLS.length === b);
  return pick(first) + Array.from({ length: 3 }, () => pick(CODE_CHARS)).join("");
}
const brokerOf = code => { const i = CODE_CHARS.indexOf(code[0]); return i < 0 ? -1 : i % URLS.length; };
function enterRoom(b, code, done) {
  net = { b, code, mine: topic(code, isHost ? "host" : "p/" + myId), all: topic(code, "all"), seen: {}, hostSeen: Date.now() };
  const subs = isHost ? [net.mine] : [net.mine, net.all];
  brokers[b].client.subscribe(subs, { qos: 1 }, () => done && done());
  net.timer = setInterval(heartbeat, 3000);
}
function leaveRoom() {
  if (!net) return;
  if (isHost) pub("all", { t: "error", msg: "방장이 방을 나갔어요." });
  else pub("host", { t: "leave", from: myId });
  brokers[net.b].client.unsubscribe(isHost ? [net.mine] : [net.mine, net.all]);
  clearInterval(net.timer); clearTimeout(net.joinTimer);
  net = null;
}
function heartbeat() {
  if (!net) return;
  const now = Date.now();
  if (isHost) {
    room.players.forEach(p => { if (p.pid !== "host" && !p.gone && now - (net.seen[p.pid] || now) > 12000) playerLeft(p.pid); });
    if (room.phase !== "play") pub("all", { t: "hb" }, true);
  } else {
    pub("host", { t: "ping", from: myId }, true);
    if (now - net.hostSeen > 12000) menu("방장과 연결이 끊겼어요.");
  }
}
function onMessage(i, t, buf) {
  if (!net || i !== net.b || (t !== net.mine && t !== net.all)) return;
  let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
  if (!m || typeof m !== "object") return;
  if (isHost) { if (typeof m.from === "string" && m.from.length < 20 && m.from !== "host") hostHandle(m.from, m); }
  else { net.hostSeen = Date.now(); clientHandle(m); }
}
// 방장 → 내 화면, 참가자 → 방장에게 보내요
function send(m, fast) { if (isHost) hostHandle("host", m); else pub("host", { ...m, from: myId }, fast); }
function toAll(m, fast) { pub("all", m, fast); clientHandle(m); }   // 방장이 모두에게 (자기 화면 포함)

function showNet() {

// ---------- 방장: 방 만들기 ----------
let room = null;   // 방장만 가지고 있는 방 정보
let G = null;      // 방장만 가지고 있는 시험 진행 정보
function createRoom() {
  saveName(); audio();
  show(`<div class="card center"><h2>🏠 방을 만드는 중...</h2></div>`);
  whenBroker(-1, b => {
    isHost = true; joined = true;
    const code = newCode(b);
    room = { code, minutes: 3, aiPro: false, phase: "lobby", players: [{ pid: "host", name: me.name || "방장" }] };
    enterRoom(b, code, () => sendLobby());
  }, () => menu("서버에 연결할 수 없어요. 학교·회사 인터넷에서 막혔을 수 있어요."));
}
function lobbyMsg() {
  return { t: "lobby", code: room.code, minutes: room.minutes, aiPro: room.aiPro,
    players: room.players.filter(p => !p.gone).map(p => ({ pid: p.pid, name: p.name })) };
}
function sendLobby() { if (room && room.phase === "lobby") toAll(lobbyMsg()); }
function setMinutes(n) { if (!isHost || room.phase !== "lobby") return; room.minutes = clamp(n, 1, 5); sendLobby(); }
function setAiPro(v) { if (!isHost || room.phase !== "lobby") return; room.aiPro = !!v; sendLobby(); }

// ---------- 참가자: 방 들어가기 ----------
function joinRoom() {
  saveName(); audio();
  const code = $("code").value.trim().toUpperCase();
  joinCode = ""; notice = "";
  if (code.length !== 4) return menu("방 코드 4자리를 써 주세요.");
  const b = brokerOf(code);
  if (b < 0) return menu("그런 방이 없어요. 방 코드를 확인해 주세요.");
  show(`<div class="card center"><h2>🔌 방 ${esc(code)}에 들어가는 중...</h2></div>`);
  whenBroker(b, () => {
    enterRoom(b, code, () => {
      net.joinTimer = setTimeout(() => menu("그런 방이 없어요. 방 코드를 확인해 주세요."), 7000);
      pub("host", { t: "join", from: myId, name: me.name });
    });
  }, () => menu("서버에 연결할 수 없어요. 학교·회사 인터넷에서 막혔을 수 있어요."));
}

// ---------- 방장: 받은 메시지 처리 ----------
function hostHandle(from, m) {
  if (!room) return;
  if (from !== "host") net.seen[from] = Date.now();
  const p = room.players.find(x => x.pid === from && !x.gone);
  const play = room.phase === "play" && G;
  switch (m.t) {
    case "join":
      if (p) return pub("p/" + from, { t: "welcome", lobby: lobbyMsg() });
      if (room.phase !== "lobby") return pub("p/" + from, { t: "error", msg: "이미 시험이 시작된 방이에요. 끝나면 다시 들어와 주세요." });
      if (room.players.filter(x => !x.gone).length >= MAX_PEOPLE) return pub("p/" + from, { t: "error", msg: "방이 꽉 찼어요. (최대 17명)" });
      room.players.push({ pid: from, name: cleanName(m.name) || "수험생" + room.players.length });
      pub("p/" + from, { t: "welcome", lobby: lobbyMsg() });
      sendLobby();
      break;
    case "leave": if (p) playerLeft(from); break;
    case "pr": if (play && G.proctor === from) setProPose(m); break;
    case "ex": if (play && p) examReport(from, m); break;
    case "inspect": if (play && G.proctor === from) doInspect(m.sid); break;
  }
}
function playerLeft(pid) {
  const p = room.players.find(x => x.pid === pid);
  if (!p || p.gone) return;
  if (room.phase === "lobby") { room.players = room.players.filter(x => x !== p); return sendLobby(); }
  p.gone = true;
  if (!G) return;
  if (G.proctor === pid) {   // 감독관이 나가면 AI 감독관이 이어서 해요
    G.proctor = "ai"; G.ai = newAI(); toAll({ t: "fx", k: "proleft", name: p.name });
  }
  const s = G.students.find(x => x.pid === pid);
  if (s) { s.pid = null; s.kind = "honest"; s.g = s.base = 1; s.swTo = -1; s.cam = 0; s.act = 0; s.timer = rand(6, 15); }
}

// ---------- 방장: 시험 시작 ----------
function hostStart() {
  if (!isHost || room.phase !== "lobby") return;
  const humans = room.players.filter(p => !p.gone);
  if (room.aiPro && humans.length > SEATS) return toast("AI 감독관일 때는 수험생이 16명까지예요.");
  const proctor = room.aiPro ? "ai" : pick(humans).pid;
  const exams = shuffle(humans.filter(p => p.pid !== proctor));
  const seats = shuffle([...Array(SEATS).keys()]);
  const total = room.minutes * 3 + 2;   // 1분 5문제 … 5분 17문제
  const students = new Array(SEATS);
  exams.forEach((p, i) => students[seats[i]] = newStudent(seats[i], "human", p.pid, total));
  const botSeats = seats.slice(exams.length);
  const n = botSeats.length;
  const nCheat = n === 0 ? 0 : n <= 3 ? 1 : Math.max(2, Math.round(n * 0.35));
  botSeats.forEach((sid, i) => students[sid] = newStudent(sid, i < nCheat ? (Math.random() < 0.7 ? "cheatG" : "cheatC") : "honest", null, total));
  G = { proctor, students, total, strikes: 0, endAt: Date.now() + room.minutes * 60000, last: performance.now(), sendT: 0, endSoon: 0,
    pro: { x: 0, z: -5.2, yaw: Math.PI, pitch: -0.15, frozen: 0 }, ai: newAI() };
  room.phase = "play";
  toAll({ t: "go", proctor, total, endIn: room.minutes * 60000,
    names: Object.fromEntries(humans.map(p => [p.pid, p.name])),
    students: students.map(s => ({ sid: s.sid, look: s.look, pid: s.pid, base: s.pid ? s.base : undefined })) });
  clearInterval(G.loop); G.loop = setInterval(hostTick, 50);
}
function newStudent(sid, kind, pid, total) {
  const { x, z } = seatPos(sid);
  const base = Math.random() < 0.55 ? 1 : 0;   // 1 일반 안경 · 0 안경 안 씀 (사람도 AI도 섞여 있어요)
  const s = { sid, kind, pid, x, z, base, g: base, swFrom: base, swTo: -1, swP: 0, cam: 0, act: 0, actT: 0, yaw: 0, pitch: -0.6,
    ty: 0, tp: -0.6, lookT: rand(0, 3), caught: false, solved: 0, total, timer: rand(2, 9), alarm: 0,
    react: rand(0.25, 1.3), careless: Math.random() < 0.2, nervous: Math.random() < 0.5, susp: 0,
    look: [rnd(LOOK.skin.length), rnd(LOOK.hair.length), rnd(LOOK.shirt.length), rnd(LOOK.style.length)] };
  if (kind === "cheatG" && Math.random() < 0.3) { s.g = 2; s.timer = rand(3, 8); }   // 처음부터 AI 안경을 쓰고 있는 애도 있어요
  if (kind === "cheatC" && Math.random() < 0.3) { s.cam = 1; s.timer = rand(3, 8); }
  return s;
}
// 지금 부정행위 장비를 쓰는 중인지 (안경을 바꾸는 중에 AI 안경을 손에 들고 있어도 걸려요)
const cheating = s => s.g === 2 || s.cam === 1 || (s.swTo >= 0 && (s.swTo === 2 || s.swFrom === 2));
const devOf = s => s.g === 2 || (s.swTo >= 0 && (s.swTo === 2 || s.swFrom === 2)) ? "glasses" : "cam";
// 지금 쓰고 있거나, 숨긴 지 2초가 안 지났으면 걸려요
const catchable = s => cheating(s) || s.hotT > 0;

function setProPose(m) {
  const P = G.pro;
  P.x = clamp(num(m.x, P.x), ROOM.x0, ROOM.x1); P.z = clamp(num(m.z, P.z), ROOM.z0, ROOM.z1);
  P.yaw = num(m.yaw, P.yaw); P.pitch = clamp(num(m.pitch, P.pitch), -1.5, 1.5); P.mv = num(m.mv, 0);
}
function examReport(pid, m) {
  const s = G.students.find(x => x.pid === pid);
  if (!s || s.caught) return;
  const gv = v => [0, 1, 2].includes(v) ? v : null;
  const g = gv(m.g), swTo = m.swTo === -1 ? -1 : gv(m.swTo);
  if (g === null || swTo === null) return;
  if (swTo >= 0 && s.swTo < 0) { s.swP = 0; s.swFrom = gv(m.sf) ?? s.g; }
  s.g = g; s.swTo = swTo; if (swTo < 0) s.swP = 0;
  s.cam = m.cam ? 1 : 0; s.act = m.act === 2 ? 2 : 0;
  s.yaw = clamp(num(m.yaw), -2.5, 2.5); s.pitch = clamp(num(m.pitch, -0.6), -1.2, 0.6);
  s.solved = clamp(Math.floor(num(m.solved)), 0, s.total);
}
function doInspect(sid) {
  const s = G.students[sid], P = G.pro;
  if (!s || s.caught || P.frozen > 0) return;
  if (Math.hypot(s.x - P.x, s.z - P.z) > RANGE + 0.9) return;
  if (catchable(s)) catchStudent(s, "pro");
  else {   // 정직한 학생! 일반 안경이면 그 안경이 부서져요
    G.strikes++; P.frozen = FREEZE;
    const broke = s.g === 1;
    if (broke) { s.g = s.base = 0; s.swFrom = 0; }
    toAll({ t: "fx", k: "wrong", sid, broke });
  }
}
function catchStudent(s, by) {
  const dev = cheating(s) ? devOf(s) : (s.lastDev || "glasses");
  s.caught = true; s.g = 0; s.swTo = -1; s.swP = 0; s.cam = 0; s.act = 0;
  toAll({ t: "fx", k: "smash", sid: s.sid, dev, by });
}

// ---------- 방장: 매 순간 진행 ----------
function hostTick() {
  if (!room || room.phase !== "play" || !G) return;
  const now = performance.now(), dt = Math.min(0.25, (now - G.last) / 1000); G.last = now;
  const P = G.pro;
  if (P.frozen > 0) P.frozen = Math.max(0, P.frozen - dt);
  if (G.proctor === "ai") aiProctorTick(dt);
  for (const s of G.students) {
    if (s.caught) { s.yaw *= 0.9; s.pitch = -0.7; continue; }
    if (cheating(s)) { s.hotT = LINGER; s.lastDev = devOf(s); } else if (s.hotT > 0) s.hotT = Math.max(0, s.hotT - dt);
    if (s.pid) { if (s.swTo >= 0) s.swP = Math.min(1, s.swP + dt / SWAP); continue; }
    botTick(s, dt, P);
  }
  G.sendT -= dt;
  if (G.sendT <= 0) { G.sendT = 0.12; broadcastState(); }
  const humans = G.students.filter(s => s.pid);
  const done = humans.length ? humans.every(s => s.caught) : G.students.every(s => s.kind === "honest" || s.caught);
  if (done && !G.endSoon) G.endSoon = 2.2;   // 마지막으로 부수는 모습을 보여 주고 끝내요
  if (G.endSoon) { G.endSoon -= dt; if (G.endSoon <= 0) return hostEnd(); }
  if (Date.now() >= G.endAt) hostEnd();
}
function broadcastState() {
  const P = G.pro;
  toAll({ t: "st", left: Math.max(0, G.endAt - Date.now()), k: G.strikes,
    pro: [r2(P.x), r2(P.z), r2(P.yaw), r2(P.pitch), P.frozen > 0 ? 1 : 0, P.mv ? 1 : 0],
    s: G.students.map(s => [s.g, s.swFrom, s.swTo, Math.round(s.swP * 100), s.cam, s.act, r2(s.yaw), r2(s.pitch), s.caught ? 1 : 0]) }, true);
}

// AI 수험생: 감독관이 멀리 있거나 딴 데를 보면 몰래 AI 안경을 껴요
function startSwap(s, to) { s.swFrom = s.g; s.swTo = to; s.swP = 0; }
function botTick(s, dt, P) {
  const dx = s.x - P.x, dz = s.z - P.z, d = Math.hypot(dx, dz) || 0.01;
  const facing = (dx * -Math.sin(P.yaw) + dz * -Math.cos(P.yaw)) / d > Math.cos(0.95);
  const threat = (d < 4.6 && facing) || d < 2.3;
  if (s.swTo >= 0) {
    s.swP += dt / SWAP;
    if (s.swP >= 0.5) s.g = s.swTo;
    if (s.swP >= 1) { s.swTo = -1; s.swP = 0; }
  }
  if (s.act) { s.actT -= dt; if (s.actT <= 0) s.act = 0; }
  // 고개: 대부분 시험지를 보고, 가끔 둘러봐요
  s.lookT -= dt;
  if (s.lookT <= 0) {
    s.lookT = rand(1.5, 5);
    const r = Math.random();
    if (r < 0.72) { s.ty = rand(-0.15, 0.15); s.tp = rand(-0.75, -0.5); }
    else if (r < 0.92) { s.ty = rand(-0.5, 0.5); s.tp = rand(-0.1, 0.2); }
    else { s.ty = rand(-1.4, 1.4); s.tp = 0; }
  }
  const using = cheating(s);
  if (using && s.nervous && threat) { s.ty = clamp(Math.atan2(dx, dz), -1.6, 1.6); s.tp = 0; }   // 들킬까 봐 감독관을 힐끔
  const k = Math.min(1, dt * 4);
  s.yaw += (s.ty - s.yaw) * k; s.pitch += (s.tp - s.pitch) * k;

  if (s.kind === "honest") {   // 정직한 학생도 가끔 안경을 고쳐 쓰거나 머리를 긁어요 (헷갈리게!)
    s.timer -= dt;
    if (s.timer <= 0 && !s.act) { s.act = 1; s.actT = rand(0.7, 1.2); s.timer = rand(6, 18); }
    return;
  }
  if (s.swTo >= 0 || s.act) return;
  const danger = threat && !(s.careless && d > 1.6);   // 덜렁이는 감독관이 아주 가까워야 알아채요
  if (s.kind === "cheatG") {
    if (s.g === 2) {
      if (danger) { s.alarm += dt; if (s.alarm >= s.react) { startSwap(s, s.base); s.timer = rand(3, 9); s.alarm = 0; } }
      else { s.alarm = 0; s.timer -= dt; if (s.timer <= 0) { startSwap(s, s.base); s.timer = rand(3, 9); } }
    } else {
      s.timer -= dt;
      if (s.timer <= 0) { if (!threat && d > 3.8) { startSwap(s, 2); s.timer = rand(4, 10); s.alarm = 0; } else s.timer = rand(0.8, 2.5); }
    }
  } else {   // cheatC: 가슴 단추에 숨긴 초소형 카메라
    const camDanger = danger && d < 3.4;
    if (s.cam) {
      if (camDanger) { s.alarm += dt; if (s.alarm >= s.react) { s.cam = 0; s.act = 2; s.actT = 0.6; s.timer = rand(3, 9); s.alarm = 0; } }
      else { s.alarm = 0; s.timer -= dt; if (s.timer <= 0) { s.cam = 0; s.act = 2; s.actT = 0.6; s.timer = rand(3, 9); } }
    } else {
      s.timer -= dt;
      if (s.timer <= 0) { if (!threat && d > 3) { s.cam = 1; s.act = 2; s.actT = 0.6; s.timer = rand(4, 10); s.alarm = 0; } else s.timer = rand(0.8, 2.5); }
    }
  }
}

// AI 감독관: 통로를 따라 순찰하다가 수상하면 다가가서 봐요
const WX = [-4.7, -2.2, 0, 2.2, 4.7], WZ = [-5.0, -2.1, 0.08, 2.29, 5.0];
function newAI() { return { i: 2, j: 0, pi: -1, pj: -1, tx: 0, tz: -5.0, wait: 1.5, lookSid: -1, scan: 1 }; }
function turnToward(P, vx, vz, maxStep) {

function suspiciousNear(P) {
  let best = null, bd = 1e9;
  for (const s of G.students) {
    if (s.caught || !(s.act || s.swTo >= 0 || cheating(s))) continue;
    const vx = s.x - P.x, vz = s.z - P.z, d = Math.hypot(vx, vz);
    const cos = (vx * -Math.sin(P.yaw) + vz * -Math.cos(P.yaw)) / (d || 1);

}
function aiProctorTick(dt) {
  const A = G.ai, P = G.pro;
  if (A.wait > 0) {
    A.wait -= dt;
    if (A.lookSid >= 0) { const s = G.students[A.lookSid]; turnToward(P, s.x - P.x, s.z - P.z, dt * 2.5); }
    else P.yaw += dt * 0.7 * A.scan;
    P.mv = 0;
  } else {
    const dx = A.tx - P.x, dz = A.tz - P.z, d = Math.hypot(dx, dz);
    if (d < 0.05) {
      const sus = suspiciousNear(P);
      A.wait = rand(0.8, 2.4); A.scan = Math.random() < 0.5 ? -1 : 1;
      const near = G.students.filter(s => Math.hypot(s.x - P.x, s.z - P.z) < 3.5);
      A.lookSid = sus ? sus.sid : (near.length && Math.random() < 0.7 ? pick(near).sid : -1);
      // 다음 갈 곳: 옆 칸 중 하나 (수상한 애가 있으면 그쪽으로)
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, b]) => [A.i + a, A.j + b])
        .filter(([i, j]) => i >= 0 && i < WX.length && j >= 0 && j < WZ.length);
      let opts = nb.filter(([i, j]) => !(i === A.pi && j === A.pj)); if (!opts.length) opts = nb;
      let nxt = pick(opts);
      if (sus && Math.random() < 0.75) nxt = opts.reduce((a, b) => Math.hypot(WX[a[0]] - sus.x, WZ[a[1]] - sus.z) < Math.hypot(WX[b[0]] - sus.x, WZ[b[1]] - sus.z) ? a : b);
      A.pi = A.i; A.pj = A.j; [A.i, A.j] = nxt; A.tx = WX[A.i]; A.tz = WZ[A.j];
      P.mv = 0;
    } else {
      const sp = Math.min(d, 1.25 * dt);
      P.x += dx / d * sp; P.z += dz / d * sp; P.mv = 1;

    }
  }
  // 눈앞에서 부정행위 장비가 보이면 잡아요
  for (const s of G.students) {
    if (s.caught) continue;
    if (!catchable(s)) { s.susp = Math.max(0, s.susp - dt); continue; }
    const vx = s.x - P.x, vz = s.z - P.z, d = Math.hypot(vx, vz) || 0.01;
    const cos = (vx * -Math.sin(P.yaw) + vz * -Math.cos(P.yaw)) / d;

      s.susp += dt;
      if (s.susp > 0.7) { catchStudent(s, "ai"); A.wait = 2.2; A.lookSid = s.sid; }
    } else s.susp = Math.max(0, s.susp - dt * 0.5);
  }
}

function hostEnd() {

function roundRect(w, h, r, dy = 0) {
  const sh = new THREE.Shape(), x = -w / 2, y = -h / 2 + dy;
  sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r);
  sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
  sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
  return sh;
}

    f.life -= dt;
    if (f.shard) {
      const v = f.obj.userData.v; v.y -= 6 * dt;
      f.obj.position.addScaledVector(v, dt);
      if (f.obj.position.y < 0.01) { f.obj.position.y = 0.01; v.set(v.x * 0.4, -v.y * 0.3, v.z * 0.4); }
      f.obj.rotation.x += f.obj.userData.r.x * dt; f.obj.rotation.y += f.obj.userData.r.y * dt;
      f.obj.material.opacity = clamp(f.life, 0, 1);
    }
    if (f.grow) f.obj.scale.multiplyScalar(1 + dt * 1.5);
    if (f.life <= 0) { (f.parent || R.scene).remove(f.obj); return false; }
    return true;
  });
  hudT -= dt; if (hudT <= 0) { hudT = 0.25; renderHudTop(); }
  R.renderer.render(R.scene, R.camera);
}
function renderHudTop() {
  if (!V) return;
  const left = V.over ? 0 : V.endAt - Date.now();
  const caughtN = V.cs.filter(c => c.caught).length;
  const role = V.role === "pro" ? "👮 감독관" : V.role === "exam" ? "🧑‍🎓 수험생" : "👀 관전";
  let extra = "";
  if (V.role === "pro") extra = `<span class="pill">💥 적발 ${caughtN}</span><span class="pill">🙅 실수 ${V.strikes}</span>`;
  else if (V.role === "exam" && EX) extra = `<span class="pill">✏️ ${EX.solved}/${V.total}</span>${EX.g === 2 ? `<span class="pill" style="color:#67e8f9">👓 AI 안경</span>` : ""}${EX.cam ? `<span class="pill" style="color:#fca5a5">📷 카메라 ON</span>` : ""}`;
  else extra = `<span class="pill">💥 적발 ${caughtN}</span>`;
  $("hudtop").innerHTML = (V.over && V.endHtml ? `<span class="pill" style="pointer-events:auto;cursor:pointer;background:#4338ca" onclick="show(V.endHtml, true)">📋 결과 보기</span>` : "") + `<span class="pill">${role}</span><span class="pill time ${left < 15000 ? "warn" : ""}">⏱ ${fmtTime(left)}</span>${extra}`;
}

// ---------- 결과 ----------
function showEnd(m) {
  if (!V || V.over) return;
  V.over = true; V.cheaters = m.cheaters || [];
  if (document.pointerLockElement) document.exitPointerLock();
  SND.bell();
  // 몰래 부정행위했는데 안 들킨 수험생을 보여 줘요
  for (const sid of V.cheaters) {
    const o = R.students[sid]; if (!o || V.cs[sid].caught) continue;
    const t = textSprite("🤫 안 들킴", "#f59e0b", "#111", 0.55); t.position.set(0, 1.62, 0); o.root.add(t); R.fx.push({ obj: t, parent: o.root, life: 9999, sprite: true });
  }
  ["paper", "joy", "inspectBtn", "cross", "aim", "lockhint", "frozen", "swapfx", "aibox", "awayhint", "caughtbox"].forEach(id => $(id).style.display = "none");
  R.renderer.domElement.style.filter = "";
  const mine = isHost ? "host" : myId;
  const res = Array.isArray(m.res) ? m.res : [];
  const exams = res.filter(r => r.pid !== m.proctor);
  const cheaters = (m.cheaters || []).length, caught = (m.caught || []).length;
  const proWin = exams.length ? exams.every(r => r.out === "caught") : caught >= cheaters;
  const OUT = { win: "🎉 성공", caught: "🚨 적발", short: "⏰ 시간 부족" };
  let title;
  if (V.role === "pro") title = proWin ? "🏆 완벽한 감독!" : "😵 놓친 부정행위자가 있어요";
  else {
    const r = exams.find(x => x.pid === mine);
    title = !r ? "시험 끝!" : r.out === "win" ? "🎉 성공! 안 들키고 다 풀었어요" : r.out === "caught" ? "🚨 부정행위 적발!" : "⏰ 시간 안에 다 못 풀었어요";
  }
  V.endHtml = `
      <div class="card">
        <div class="big">${title}</div>
        <div class="sub center">감독관: ${esc(m.proName)} · 부정행위 ${cheaters}명 중 <b>${caught}명 적발</b> · 정직한 학생 안경 부숨 ${num(m.strikes)}번</div>
      </div>
      <div class="card">
        <h2>🧑‍🎓 사람 수험생 결과</h2>
        ${exams.length ? `<table class="res">${exams.map(r => `<tr><td>${String(r.sid + 1).padStart(2, "0")}번</td><td><b>${esc(r.name)}</b>${r.pid === mine ? " (나)" : ""}</td>
          <td>✏️ ${r.solved}/${r.total}</td><td>${OUT[r.out] || ""}</td></tr>`).join("")}</table>` : `<div class="sub">사람 수험생이 없었어요 (AI 수험생만 있었어요)</div>`}
      </div>
      <div class="card">
        ${isHost ? `<button class="btn red" style="margin-top:0" onclick="hostAgain()">🔁 다시 하기 (대기실로)</button>` : `<div class="notice center" style="margin-top:0">방장이 다시 하기를 누르면 대기실로 가요</div>`}
        <button class="btn gray" onclick="hideUI()">🔍 교실 둘러보기</button>
        <button class="btn gray" onclick="menu()">나가기</button>
      </div>`;
  setTimeout(() => { if (V && V.over) show(V.endHtml, true); }, 1800);
  renderHudTop();
}

// ---------- 시작 ----------
menu();
connectBrokers();
</script>
